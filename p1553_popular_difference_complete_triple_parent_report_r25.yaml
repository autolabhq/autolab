theorems:
  - >-
    The both-branch source count at shift q is at most the ordered difference
    multiplicity r_(Z-Z)(2q).
  - >-
    If total both-branch containment is at least alpha*S*L, then at least
    alpha*L/(2-alpha) shifts have difference multiplicity at least alpha*S/2.
  - >-
    The additive energy is at least
    alpha^3*L*S^2/(4*(2-alpha))=Omega_alpha(L*S^2).
  - >-
    For |Z|=Theta(S), the associated BSG parameter is only O(S/L)=O(B), so
    no constant-loss public chart follows from energy alone.
  - >-
    Even when all three complete values lie in C, the ambient tagged alphabet
    has Theta(r^3)=Theta(B^3) states; O(B^2) image size still requires the R23
    Omega(S*L*d)=Omega(B^4) complete collision budget.
