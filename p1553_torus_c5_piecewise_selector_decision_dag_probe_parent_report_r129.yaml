verified_statements:
  - >-
    Injective degree-five source monomials require every square C2 branch,
    and the remaining cross branches are an edge set hitting every
    five-subset.
  - >-
    Turan's theorem gives the exact minimum branch count
    n+binom(n,2)-ex(n,K5)=Theta(n^2)=B^(3/2+o(1)).
  - >-
    All eight actual optimal branch covers locate every positive target,
    replay C2+C3 sources, and reject zero after a full branch scan.
  - >-
    Sequential scanning costs B^(3/2+o(1)) per target and an explicit
    target router costs B^(15/4+o(1)) state.
