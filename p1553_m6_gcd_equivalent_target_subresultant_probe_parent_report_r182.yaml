verified_statements:
  - Public target deduplication preserves the gcd-zero union.
  - Unique elliptic targets partition into at most two x-injective charts.
  - An opposite-point adversarial control forces two charts and preserves exact kernel values.
  - On squarefree target charts, norm zero, nonunit status, and nonconstant gcd are equivalent.
  - All twelve ordinary controls replay exact remainders, Newton norms, gcds, and candidate factors.
  - All 151 represented unit inverse certificates verify exactly.
  - Every ordinary remainder body is fully dense and every remainder matrix has full target rank.
  - Standard represented remainder, trace, inverse, norm, and half-GCD routes retain nN scale.
