verified_statements:
  - >-
    Tao's sharp support inequality closes the complex sparse-Fourier zero
    test and exact-indicator grammars at the frozen setup cap.
  - >-
    Every actual R82 pairing field has characteristic=6q-1 and
    ord_q(characteristic)=2, outside the pinned primitive finite-field
    Chebotarev sufficient condition.
  - >-
    Over GF(2^10), an exact five-mode polynomial has exactly five zeros on
    an order-11 subgroup and its corresponding 5-by-5 Fourier minor has
    rank four.
  - >-
    The complex sparse-zero consequence therefore cannot be transferred to
    arbitrary finite coefficient fields without a field-specific theorem.
