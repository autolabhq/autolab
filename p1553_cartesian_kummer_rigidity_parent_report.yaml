frozen_interface:
  group_order: N=p^(1+o(1))
  label_bound: B=N^(1/5)
  exact_count_threshold: 32*B^4<p
  setup_and_state_cap: B^(9/4+o(1))
  online_and_workspace_cap: B^(5/4+o(1))
  output: exact restricted miss or one verified signed occurrence-labelled source
  source_assumptions: nonidentity within-color-unique x-classes; cross-color copies remain separate occurrences; nonzero target for S_6 comparison
verified_statements:
  - >-
    The coefficient of -R in the product of five sign-closed occurrence
    measures is the exact signed source count. It has the same zero set as the
    S_6 projector count but a different multiplicity.
  - >-
    For nonidentity x-classes in an odd prime subgroup, the projector count z
    and signed count M satisfy z<=M<=16*z and
    M<=16*min_j(product_(i!=j)|I_i|). The R9 no-wrap threshold applies.
    Within-color multiplicity kappa_j multiplies the corresponding bound and
    requires a fresh finite-size threshold check.
  - >-
    Exact signed counts support one-source dyadic replay in at most
    1+5*ceil(log_2 B) calls, followed by constant sign enumeration and
    complete projective verification.
  - >-
    The actual signed 2|3 kernel is endpoint equality under translation. On
    the full subgroup it is an N by N permutation matrix; on finite decks its
    rank is only the number of matched attained endpoints.
  - >-
    Let psi have degree d_psi and f=psi composed with x have degree 2*d_psi. For two
    distinct Kummer source classes, complete branch equality can hold at no
    more than 16*d_psi second-list points when pole cases are included,
    provided 2*d_psi<N. The clean-chart bound is 8*d_psi.
  - >-
    Consequently, a full Cartesian second deck of size B admits no nontrivial
    branch-oblivious merger for d_psi<B/16. The general collision-incidence
    count is O(d_psi^2*B), so retaining Theta(B^2) compressed first-stage
    occurrences requires d_psi=Omega(B^(1/2)).
  - >-
    A degree-O(B) interpolation map can transport one finite Cartesian grid
    without being a global Kummer transporter. The exhibited control is
    injective on that grid and supplies no source compression.
