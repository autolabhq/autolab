    The Kummer preimage Z_C of r projective psi-values has at most d*r
    distinct classes, including pole and infinity fibers.
  - >-
    For fixed fifth class q and preimage class z, at most the two endpoint
    classes [z+q] and [z-q] put z on a complete translated branch.
  - >-
    The exact distinguished stratum H_C therefore has size at most 2*L*d*r
    and relative mass at most 2*d*r/S for arbitrary co-designed supports.
  - >-
    Any router whose only certified nontrivial key identifications occur in
    H_C needs r=Omega(S/d) before it can claim global O(n/d) image size.
