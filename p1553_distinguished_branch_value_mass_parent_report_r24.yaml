summary: >-
  A degree-d rational Kummer map has at most d*r prime-subgroup Kummer
  preimages over any r prospectively distinguished output values. Across an
  arbitrary L-element fifth deck, at most 2*L*d*r distinct geometric sources
  can put one of their two translated branches in those fibers. Therefore an
  r=o(S/d) planted zero, pole, or other small value alphabet touches o(SL)
  sources and cannot by itself create global d-fold complete-image
  compression. The first mass-admissible case r=Theta(S/d)=Theta(B) remains
  open.
