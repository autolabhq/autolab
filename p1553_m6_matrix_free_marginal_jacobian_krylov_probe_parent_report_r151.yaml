verified_statements:
  - >-
    The aggregate marginal matrix is the logarithmic weight Jacobian of the
    vector-valued aggregate fiber-count map.
  - >-
    Mx is a forward directional derivative, M^T lambda is a reverse gradient
    of a scalar contraction, and lambda dot Mx equals x dot M^T lambda.
  - >-
    All eight actual finite systems satisfy the transpose identity and replay
    their selected full-rank systems, factor logs, and shifted descents.
  - >-
    Conditional on B^(5/4) reusable applications of both operators,
    B^(3/4) Wiedemann iterations cost B^(2+o(1)), below setup and rho.
  - >-
    Baur-Strassen does not by itself preserve the offline-online split or
    provide reusable tangent and adjoint state.
