verified_statements:
  - All six R178 signed aggregate residues replay exactly.
  - All six selected-divisor polynomials are squarefree.
  - The 202 order-one CRT residues reconstruct every 202-slot aggregate exactly.
  - Zero and the local power polynomial agree in the local quotient but differ modulo U in every control.
  - A single order-n x-adic application and n order-one CRT applications both instantiate the published cost at softly n squared.
  - The two finite degree-precision totals are each 8,922, matching the represented pair count.
  - Expanding the target dual-Chow form reaches the B^(5/2) rho boundary.
