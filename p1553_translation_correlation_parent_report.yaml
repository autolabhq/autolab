verified_statements:
  - >-
    On every regular complete chart, branch trace and norm are
    h(A+Q)+h(A-Q) and h(A+Q)h(A-Q). A separating scalar moment therefore
    expands into weighted correlations of h(A), h(A+Q), and h(A-Q).
  - >-
    The raw map (A,Q) to (A+Q,A-Q) is bijective onto its image because N is
    odd, with inverse A=(X+Y)/2 and Q=(X-Y)/2. Listing both branch translates
    therefore retains exactly S*L source pairs before the map h merges them.
  - >-
    With the stated Fourier convention, each three-point correlation has an
    exact double-character sum indexed by alpha and beta. The change to
    alpha*beta and alpha*beta^(-1) is bijective and does not remove the second
    frequency variable.
  - >-
    If one branch exponent is zero, its Fourier transform is a delta at the
    trivial character and the correlation reduces to a one-frequency positive
    control. A general complete divisor key requires both branch values.
  - >-
    Globally composable target-independent buckets on the prime-order EC group
    are constant or injective by the bound IDEA-057 theorem. Coordinate hashes
    need a new charged nonhomomorphic correction law.
  - >-
    Sparse nonnegative convolution works from known integer indices and
    cancellation-free coefficients. Complete Kummer moments have unknown EC
    scalar indices and field-valued correlations that can cancel; image size
    K is not ordinary convolution support size.
  - >-
    R10 has nonnegative multiplicative histograms, but a full convolution can
    have B^4 outputs while only B shifted coefficients are queried. A
    full-support output-sensitive algorithm is the wrong interface in that
    regime.
