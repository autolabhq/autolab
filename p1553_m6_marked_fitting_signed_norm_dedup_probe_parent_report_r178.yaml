verified_statements:
  - The signed row norm vanishes exactly at selected points with at least one R177 signed incidence.
  - All six row-norm interpolations are exact and occupy all 202 represented aggregate slots.
  - The aggregate signed-norm gcd is identical to the R174 and R177 candidate factor in every control.
  - The R177 marker factors into squarefree incidence-threshold factors G_r.
  - The global threshold degrees are 140, 71, 23, and 7 and sum to the marker degree 241.
  - The first threshold factor contains all 140 distinct candidates and higher layers add no ECDLP roots.
  - The full R177 marker is not a distinct ECDLP primitive from the R174 signed aggregate norm.
  - Standard nN, n squared, and explicit marker routes remain above rho.
