frozen_interface:
  group_order: N=p^(1+o(1)) prime
  characteristic: p>3
  label_bound: B=N^(1/5)
  pair_endpoint_support: U of size S
  pair_occurrence_weights: omega(u) positive integers summing to B^2
  fifth_occurrences: L=Theta(B), specialized to L=B
  image_map: Phi(u,q)=(psi(u),[f(A+Q)]+[f(A-Q)])
  image_size: K
  graph_degree: n=S*L
  total_occurrence_mass: B^2*L=B^(3+o(1))
  setup_and_state_cap: B^(9/4+o(1))
  online_and_workspace_cap: B^(5/4+o(1))
  output: exact restricted miss or one completely verified signed occurrence-labelled source
verified_statements:
  - >-
    Transposing R11 at fixed endpoint gives at most 16d endpoints for every
    colliding pair of distinct fifth labels. Two Cauchy-Schwarz steps and the
    at-most-d psi fiber yield
    K>=S^2*L^2/(d*(S*L+32d*binomial(L,2))).
  - >-
    At certified dense support S=Theta(B^2), L=Theta(B), and d<=B, the erased
    image has K=Omega(B^3/d). Any explicit O(K) representation below the
    B^(9/4+o(1)) state cap therefore requires d=Omega(B^(3/4-o(1))).
  - >-
    After a valid projective chart and injective scalar projection are chosen,
    the radical image polynomial P, geometric multiplicity interpolant,
    occurrence-mass interpolant, one pair-occurrence selector, one fifth-label
    selector, constant-many full-key coordinates, and an equivalent
    root-indexed table use O(K) base-field coefficients.
  - >-
    The pair and fifth selectors are one jointly chosen set-theoretic section:
    at every image root they name the same source preimage. Independent
    marginal selectors are not source-faithful.
  - >-
    For random projection, chart failure is at most K/p and collision failure
    is at most K(K-1)/(2p). Under K<=B^(9/4+o(1)) and p=B^(5+o(1)), the latter
    is B^(-1/2+o(1)); a constructor must charge collision detection,
    resampling, and complete verification.
  - >-
    The full graph norm or characteristic polynomial equals the product over
    U x I_5, has degree n=S*L, and factors as product_y(T-t_y)^m_y. Its
    squarefree part has degree K, but squarefree reduction after construction
    does not refund degree-n represented traffic.
  - >-
    Explicit multiplication matrices, split graph values, graph geometric
    resolutions, and explicit pushforward or Fitting modules expose at least
    n base-field entries in the frozen graph-first represented grammar. At
    dense support n=Theta(B^3).
  - >-
    O(K) source witnesses prove only that represented roots have preimages.
    Even with total geometric and occurrence masses, they do not prove that
    all actual image states were represented. Standard exact containment
    verification returns to the n-dimensional source algebra.
  - >-
    One selected source per image state cannot answer an adaptive child that
    excludes the selected source but contains another source in the same
    fiber. Exact child packages, a range-count/source-selector index, or an
    implicit child fiber query are additionally required.
  - >-
    The compact image package does not express R10's rank-two sparse
    multiplicative convolution. Known exact evaluators remain B^3 direct work
    or p-1 dense modes.
  - >-
    P1510 is an independently audited output-sensitive marked-resultant
    compiler on a different frozen family. It prevents treating resultant
    syntax or graph degree as an unrestricted image-construction lower bound.
