  claim_under_review: >-
    The complete high-degree Kummer branch map has compact O(d^2) chart
    representation; certified exact trace moments give an O~(K) image,
    multiplicity, occurrence-weight, and key decoder; every named standard
    moment constructor exposes an over-cap object while compact trace,
    containment, joint source, child, target, and rank-two operations remain
    open.
  objections: []
  required_controls:
    - exact short-Weierstrass branch quadratic and saturated exceptional charts
    - nonzero geometric multiplicities and Vandermonde-Hankel determinant
    - zero image coordinates and integer no-wrap below p
    - finite-prefix stopping versus exact image containment
    - jointly coupled source rather than independent marker sums
    - fifth-first d*L^2 and full S*L represented-route charges
    - additive, multiplicative, P1510, and uniform-fiber positive controls
    - R10 query-sensitive rank-two convolution
    - adaptive children, fresh targets, density, rank, factor logs, and descent
  counterexample_or_mutation: >-
    Two multiple fibers can share the same pair and fifth marker sums without
    sharing the independently selected pair and fifth coordinates. A finite
    recurrence fitting a moment prefix can also omit image states when no
    exact upper bound or annihilation identity is supplied.
  baseline_comparison: >-
    The compact map input is B^(2+o(1)), and the supplied-moment decoder fits
    O~(K). Standard fifth-first dense elimination already has d*L^2 at least
    B^(11/4), while source-first quotient, norm, Krylov, and containment routes
    expose S*L=B^3. No admitted route meets the online source, child, target,
    and rank-two gates or establishes a complete sub-rho ECDLP path.
  narrowest_supported_statement: >-
    ACCEPT the compact branch formula, exact trace-Hankel decoder, and scoped
    standard-constructor failures. Preserve compact moment compilation,
    compressed containment, joint source selection, query-sensitive range and
    convolution structures, and arbitrary circuits as open.
  next_concrete_action: >-
    Write one compact complete-chart tensor-trace constructor that outputs the
    required moment families, proves P(a)=0, and supports one joint source,
    adaptive children, fresh targets, and R10 rank two without any S*L vector,
    d*L^2 dense resultant, d^2 online join, or unproved stopping rule.
