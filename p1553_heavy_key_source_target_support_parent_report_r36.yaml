theorems:
  - >-
    A heavy oriented key has at least tau*B sources in a candidate rectangle
    of size at most B^2, so uniform exact rejection sampling returns a
    coupled all-shift source in expected at most B/tau trials.
  - >-
    Every useful signed endpoint of a both-branch selected source lies in Z,
    so combining it with the other pair deck covers at most O(B^4) targets.
  - >-
    Uniform known-log target success is at most B^(-1+o(1)), independently
    of complete-key and source multiplicities above one endpoint.
  - >-
    At density loss one, the R10 campaign formula requires target query
    exponent below one half for a strict sub-rho result; kappa=5/4 gives
    lambda at least 13/20.
  - >-
    The necessary fresh-target projection is marked 3SUM-Indexing on two
    B^2-point sets; the direct R31 path-block schedule has state B^2*h and
    query B^2/h+B.
