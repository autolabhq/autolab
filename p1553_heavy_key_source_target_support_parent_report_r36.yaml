summary: >-
  A captured oriented key occurring on a constant fraction of fifth shifts
  has an exact Las Vegas source section over all shifts in expected O(B)
  work: sample its degree-B center fiber times the B fifth labels and verify.
  This removes the unrestricted root-witness table as the immediate blocker.
  However, both-branch containment places every target-visible endpoint in
  the same B^2-point set Z. With the other B^2 pair endpoint deck, compressed
  rows cover only O(B^4) targets in a group of order B^(5+o(1)), forcing
  density loss at least one exponent. A sub-rho route now requires a marked
  path-structured 3SUM target index below B^(1/2) average query work.
