accepted_corrections:
  - id: x_class_contract
    statement: >-
      Factor labels are nonidentity classes {P,-P}, each with a canonical
      representative, global column, and occurrence backpointers. Dyadic
      restrictions are sign closed.
  - id: domain_binding
    statement: >-
      D_i(z_i)=product_(a=0)^(s_i-1)(z_i-a)=0 binds legal local labels.
  - id: exact_sign_biconditional
    statement: >-
      S_6=0 iff R+sum_i sigma_i*P_(C_i)=O for one of 2^5 source sign vectors,
      after globally normalizing the target sign.
  - id: output_scope
    statement: >-
      The oracle must return one verified root or an exact no-root certificate;
      all-root enumeration is not required.
  - id: replay_scope
    statement: >-
      B^(1+o(1)) covers map selection and candidate evaluation only. Root,
      exact-miss, output, negative-child, and bit costs remain unsupplied.
  - id: dense_scope
    statement: >-
      Theta(B^5) is the full dense monomial envelope, not a lower bound against
      selected sparse shifts or implicit tensor, circuit, or nonlattice routes.
row_semantics:
  repeated_class_coefficient: c_C=sum_(i:C_i=C) sigma_i
  known_log: r+sum_C c_C*log_P(P_C)=0 mod N
  blind_descent: x=-t-sum_C c_C*log_P(P_C) mod N
  rank_rule: credit only the aggregated global-column row
  zero_target: resample for known-log collection; direct x=-t in blind descent
cost_reconstruction:
