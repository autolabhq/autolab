summary: >-
  R27 selected-delta saturation is re-expressed as actual common effective
  sub-divisors of a fiber of g and a translated fiber. Full translated fibers
  are impossible because they imply cT=0. Unless occupied value-shift cells
  already have the dense Lc^2 scale, singularity mass forces growing common
  sub-divisors. Removing each common part leaves complementary divisors whose
  Abel sums differ by exactly cT. A scalar interval saturates the B^3 delta
  scale on one fiber, proving that delta mass alone is a false positive; it
  fails the B^2 support, single-pencil decomposition, complete image, and
  ECDLP interfaces.
