theorems:
  - >-
    A nonzero prime-subgroup translation cannot carry one full degree-c fiber
    to another when c<N; the maximum common fiber-subdivisor degree is c-1.
  - >-
    If D is Omega(Lc^2) but the number of occupied shift-value cells is
    o(Lc^2), the maximum selected cell multiplicity grows, and one dyadic
    layer contains at least D/(4h^2 log c) cells with common-subdivisor degree
    at least h.
  - >-
    Removing a degree-u common sub-divisor leaves two degree-(c-u)
    complementary divisors whose Abel sums differ by exactly cT.
  - >-
    The r selected fibers must be the zero divisor of one decomposed function
    H_C composed with g; unrelated convenient degree-c blocks do not form a
    passing pencil.
  - >-
    A scalar interval on one declared fiber contributes Theta(Lc^2) selected
    delta defect for L=Theta(c), but supplies only c support points and no
    degree-c pencil with c selected fibers or complete cryptanalytic interface.
