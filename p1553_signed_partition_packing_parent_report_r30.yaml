summary: >-
  If the selected both-branch stratum owns all nontrivial compression in an
  O(B^2) complete image, it contains B^3-O(B^2) sources. The resulting 2B
  signed translated-fiber partitions are near-complete on B^2 points. An
  exact pair-packing inequality forces Omega(B^4) repeated point-pairs across
  the partitions. Weighting by signed differences then yields Omega(B)
  distinct difference shifts whose translate curves each place Omega(B^2)
  normalization-collision defect on the selected grid. Thus near-total R27
  branch B reduces to the R28 selected-singularity residual-divisor branch.
