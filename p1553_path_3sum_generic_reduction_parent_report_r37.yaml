    The explicit mixed-radix lists guarantee a positive marked path-3SUM
    query for every secret scalar below the prime group order.
  - >-
    Every returned occurrence-label tuple recovers the secret exactly modulo
    the group order, including modular wraps and repeated endpoints.
  - >-
    Setup B^s and B^2 queries of average cost B^kappa yield generic DLP work
    B^max(s,2+kappa,2), so Shoup forces max(s,2+kappa) at least 5/2-o(1).
  - >-
    Under setup s at most 9/4, a generic path-only index has kappa at least
    1/2-o(1), matching the strict R36 sub-rho threshold.
