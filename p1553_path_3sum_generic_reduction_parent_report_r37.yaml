summary: >-
  Four mixed-radix lists of length B encode an arbitrary prime-order DLP into
  two pair endpoint decks, one of which is B public translation paths. One
  of B^2 known-log target queries returns marked labels that recover the
  scalar exactly. A generic path-only index with setup exponent s and average
  query exponent kappa therefore solves DLP in B^max(s,2+kappa,2) work.
  Shoup forces max(s,2+kappa) at least 5/2-o(1), so the campaign setup cap
  implies kappa at least 1/2-o(1), exactly R36's density-adjusted threshold.
  The common degree-B elliptic pencil and heavy-key marks are excluded from
  the reduction and remain the only admitted coordinate-level escape.
