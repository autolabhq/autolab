summary: >-
  Let H_f be the translation stabilizer of a separable degree-m<N even
  function f on E, let e=|H_f|, and let c=m/e be the degree after its maximal
  isogeny quotient. For every nonzero T in the prime-order subgroup,
  [k(E):k(f(R),f(R+T))]=e and the irreducible translate correspondence has
  bidegree (c,c). The isogeny quotient is injective on the prime subgroup, so
  r selected values contain at most c*r subgroup points. A B^2 pullback over
  B values therefore forces c=Omega(B), excluding a globally constant-degree
  addition-law compressor. Finite exceptional-value saturation remains open.
