theorems:
  - >-
    A genus-zero common quotient of f(R) and f(R+T) would make the degree-m
    pole divisor linearly equivalent to its T-translate and force m*T=O,
    impossible for nonzero T in the prime-order subgroup.
  - >-
    Every genus-one common quotient is an isogeny carrying f, so its kernel is
    contained in H_f; invariance under H_f gives the reverse degree inequality.
  - >-
    Therefore [k(E):k(f(R),f(R+T))]=|H_f| for every nonzero subgroup T.
  - >-
    The irreducible translate correspondence has bidegree (c,c), where
    c=m/|H_f|.
  - >-
    Since H_f intersects the prime subgroup trivially, r selected values have
    at most c*r prime-subgroup preimages.
  - >-
    A Theta(B^2) pullback over Theta(B) values forces c=Omega(B), excluding a
    global o(B)-degree translate law for the mass-admissible support.
