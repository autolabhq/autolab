verified_statements:
  - >-
    For polynomial psi=h with a full zero fiber, any shared right factor for
    endpoints A_1 and A_2 is totally ramified at q=x(A_1).
  - >-
    If h(x(A_2+A_1)) and h(x(A_2-A_1)) are distinct and one branch derivative
    is nonzero, the complete trace/norm map for A_2 is unramified at x(A_1),
    contradicting every nontrivial shared factor.
  - >-
    The local-witness conditions define a nonempty Zariski-open endpoint locus
    for every d>=3.
  - >-
    Bounded-bidegree paired cross equations having a common off-diagonal
    factor form a proper closed coefficient envelope X_cross. Every genuine
    paired-degree-greater-than-one point lies in this envelope, but special
    denominator or chart artifacts prevent identifying the envelope with the
    genuine exceptional locus without further saturation analysis.
  - >-
    A generic degree-d denominator therefore makes one endpoint pair
    birational and rejects a simultaneous common right factor for the block.
