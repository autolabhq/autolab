verified_statements:
  - Six balanced numerator and denominator trees close at infinity with 80 total line merges and maximum depth four.
  - The trees match the dense R167 witnesses up to nonzero scalar on 192 safe comparisons.
  - The compact tree quotient replays all selected rows and exactly the 140 R167 candidate roots.
  - 1,222 admissible generic-shift line reciprocity identities hold exactly; 58 pole or nonunit rows are explicitly skipped.
  - Every selected endpoint has f0(-P)=0, so linewise ratios require symbolic numerator-denominator cancellation before specialization.
  - Internal sums, origin factors, the common zero, and public correction leaves telescope, leaving exactly 40 target leaves across the six controls.
  - Balanced streaming reduces depth and live state but retains B^(7/2) node-local or leaf-local work.
