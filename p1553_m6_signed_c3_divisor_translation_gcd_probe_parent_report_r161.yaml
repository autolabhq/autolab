verified_statements:
  - >-
    On the injective signed C3 chart, U is the product of endpoint
    x-coordinates and the interpolant V satisfies U dividing
    V^2-(X^3+aX+b).
  - >-
    The quotient formulas lambda=(v+V)/(u-X), phi=lambda^2-u-X, and
    psi=lambda(u-phi)-v compute T-P outside the explicitly split roots u=X.
  - >-
    The gcd of U, U(phi), and psi-V(phi) returns exactly the regular signed
    C3 endpoints participating in positive C3+C3 decompositions of T.
  - >-
    For a target with one positive-C6 coefficient source, the source gcd has
    degree at most binomial(6,3)=20; this bounds output size but not
    composition work.
  - >-
    Six finite controls verify the signed divisor, every preregistered
    positive source, one empty target, and the denominator-exception branch
    without consuming candidate oracles.
  - >-
    Independent degree-B^(9/4) composition over B^(5/4) targets costs
    B^(7/2), so the explicit route remains above Pollard rho.
