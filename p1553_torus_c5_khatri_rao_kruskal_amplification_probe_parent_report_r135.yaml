verified_statements:
  - >-
    Over any field, the Kruskal rank of a Khatri-Rao product is at least
    the sum of the input Kruskal ranks minus one, capped by the column
    count.
  - >-
    The all-five-atoms-from-one-color C5 evaluation submatrix is the
    row-deduplicated fifth Khatri-Rao power of the atom evaluation matrix.
  - >-
    Atom Kruskal rank two recovers the deterministic six-mode obstruction
    but gives no structured seventh-mode credit.
  - >-
    Under the frozen uniform-random-deck model, sparse-root bounds and
    Khatri-Rao amplification exclude represented predicates through
    (5-o(1))*log2(q) modes with overwhelming probability.
  - >-
    Twelve finite controls replay atom Kruskal rank two, product Kruskal
    rank six, row deduplication, source products, and color acceptance.
