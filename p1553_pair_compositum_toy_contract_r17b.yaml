  ID. The field, curve, subgroup, psi, endpoint pair, algebra, controls, and
  decision rule are unchanged from R17 and R17A.
objective: >-
  Compute the generic degree of the same complete paired Kummer branch map as
  R17 after the reporting-only repair.
fixture:
  field: F_193
  curve: y^2=x^3+2x+3
  subgroup_order: 103
  generator: [1, 44]
  degree: 3
  endpoint_scalars: [1, 2, 3]
  endpoint_x_coordinates: [1, 184, 62]
  paired_endpoint_scalars: [1, 2]
  psi_numerator: (t-1)*(t-184)*(t-62)
  psi_denominator: t^3+5*t+7
  block_value: 0
preconditions:
  - the curve and listed generator have exact order 103
  - numerator and denominator are coprime and the denominator is nonzero on the block
  - the derivative numerator is squarefree and infinity is unramified
  - all endpoint and fifth Kummer formulas use both trace and norm
method:
  - reduce numerator and denominator of psi in the quadratic Kummer addition algebra
  - construct exact rational trace and norm maps for each paired endpoint
  - cross-multiply the four q-versus-q_prime equalities
  - compute their common bivariate gcd and factor it over F_193
  - require every equality to contain the diagonal q-q_prime
decision_rule:
  reject_candidate_block: >-
    The common gcd has no irreducible factor other than q-q_prime, so the
    paired map is birational onto its image and no nontrivial shared right
    factor exists.
  retain_for_review: >-
    A non-diagonal factor survives all four complete equalities; report it
    without promoting an algorithmic claim.
exclusions:
  - no extrapolation from degree three to asymptotic d
  - no finite-deck saturation claim
  - no fresh-target or R10 claim
  - no relation-density, rank, factor-log, or descent claim
  - no Shoup-bound or breakthrough claim
