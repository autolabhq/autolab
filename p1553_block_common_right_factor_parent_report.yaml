verified_statements:
  - >-
    A degree-one component of the ordered cross-endpoint branch fiber product
    is the graph of an elliptic automorphism. Direct or swapped coordinate
    comparison yields iota_A'=sigma*iota_A*rho^(-1) for deck automorphisms
    rho and sigma of f.
  - >-
    Writing deck automorphisms as translations followed by origin-fixing
    automorphisms forces the same linear part and
    2A'=2u(A)+R+S. Since [-1] is a deck automorphism, 2R and 2S lie in the
    finite translation deck subgroup.
  - >-
    For endpoints in the prime-order subgroup, A'-u(A) is both N-torsion and
    killed by four times the translation-deck order. Since that order is below
    N, A'=u(A). In characteristic greater than three, this gives at most three
    Kummer-class partners.
  - >-
    Polynomial component compression must therefore use a higher-projection
    component, a non-birational branch map, or a nontrivial common
    intermediate cover. Zero-dimensional cross collisions remain outside the
    degree-one classification.
  - >-
    If psi is polynomial, the pullback of the projective hyperplane of branch
    divisors containing infinity is 2d*[x(A)]. Any common factor pi_z of
    degree greater than one must be totally ramified at x(A).
    Riemann-Hurwitz permits at most two such points, so every nontrivial
    polynomial block has m_z<=2 and cannot be balanced as d grows.
  - >-
    For every geometric value c, let r_c be the support size of psi^(-1)(c).
    Every endpoint block with a degree-e_z common factor obeys
    m_z*max(0,e_z-2r_c)<=8r_c*(e_z-1), hence
    r_c>=m_z*e_z/(2m_z+8(e_z-1)). Balanced factors require r_c=Omega(d)
    uniformly for every c.
  - >-
    The value-fiber theorem is invariant under output Mobius maps because
    Sym^2(M) only relabels complete branch outputs. It closes every map with
    one sparse value fiber, including Mobius-disguised polynomial and power
    maps and the unbounded cyclic or dihedral tame Galois quotient families.
  - >-
    A common right factor pi_z of degree e_z for every complete branch map in
    one psi block gives exact branch containment when all tagged chart
    identities F_A=G_A*pi_z are certified.
  - >-
    The function-field direction is contravariant: a shared right factor is
    detected by the compositum C_z=k(T_A,V_A:A in H_z), which is contained in
    k(pi_z). The intersection of the branch-coordinate fields instead encodes
    common left composites and cannot certify a shared right factor. The
    X=q^2, Y=q^3 control has intersection k(q^6) but compositum k(q), so an
    intersection-only route is a false positive.
  - >-
    For each endpoint pair, e_z divides the generic degree of the paired
    complete trace/norm map whenever a degree-e_z common right factor exists.
    One pair that is birational onto its image therefore rejects every
    nontrivial common right factor for the full block, provided all projective
    charts and the diagonal saturation are certified.
  - >-
    With J_z attained fifth quotient labels, total setup work is
    O~(S+sum_z[L+e_z+m_z(J_z+d/e_z)+v_z]) and retained state is
    O~(S+sum_z[J_z+m_z*J_z]).
  - >-
    If the blocks, factor degrees, finite-deck image sizes, and certificate
    costs satisfy m_z=e_z=Theta(d), J_z=O(L/d), number of blocks Theta(S/d),
    and total v_z=O~(S+SL/d), the compiler costs O~(S+SL/d), at most B^(9/4)
    in the surviving degree range.
  - >-
    Canonical dyadic fifth histograms fit O~(SL/d) work and state. Given a
    queried complete key, the inherited pair dictionary and degree-O(1)
    balanced outer maps answer an endpoint/fifth child in O~(d) work with
    exact integer multiplicity and one jointly coupled source.
  - >-
    Isogeny and Lattes maps are exact common-factor controls. On the target
    prime-order subgroup they are injective, so endpoint blocks have size one
    and the fifth finite image has J_z=L; the required finite-deck
    compression fails.
