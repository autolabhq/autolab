exactly_one_next_action: >-
  Construct or refute one explicit non-isogeny block whose rational psi is
  non-Galois and has Omega(d) support in every geometric value fiber, with
  m_z=e_z=Theta(d), J_z=O(L/d), complete trace and norm factorization, and
