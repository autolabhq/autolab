verified_statements:
  - A scalar subset product is zero exactly when its subset contains an R174 candidate leaf.
  - Balanced zero-product group testing recovers all K candidates in at most 1 plus 2 K ceil log2 n queries.
  - Queried subset volume is at most n times 1 plus ceil log2 n.
  - Six controls make 358 exact queries and recover all 140 R174 roots.
  - The controls query subset volume 1,238 against a proved finite bound of 1,374.
  - Every queried compact U_S and V mod U_S descriptor interpolates its endpoints.
  - Given the stated reusable scalar oracle and R163 K exponent, the conditional total is B to the 9 over 4 below rho.
  - The reusable scalar oracle is not supplied and the direct expanded route costs B to the 23 over 4.
