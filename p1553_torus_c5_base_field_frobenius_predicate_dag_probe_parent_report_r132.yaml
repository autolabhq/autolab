verified_statements:
  - >-
    In each actual pairing field, p=-1 mod q and Frobenius maps every
    order-q target z to z^(-1).
  - >-
    Univariate F_p polynomial and rational zero or definedness outcomes are
    invariant under target inversion, so deterministic DAGs of those
    outcomes cannot distinguish an inverse pair.
  - >-
    In all eight actual pairing decks, every positive C5 target and every
    active color target has an inverse outside the full C5 support.
  - >-
    Every exact full-support and color-support root annihilator contains an
    extension-field coefficient.
