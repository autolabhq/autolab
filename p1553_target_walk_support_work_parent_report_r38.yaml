theorems:
  - >-
    An explicit target walk of work W visits at most W translated endpoint
    positions, so a random base mask is positive with probability at most
    min(1,|V|W/N).
  - >-
    Repeating independently masked explicit boundary walks costs at least
    N/|V|=B^(3-o(1)) in expectation for one scalar-blind hit.
  - >-
    For one shift, batch work and support are both Theta(B^2+L*d0), so no
    boundary exponent gives a favorable explicit-walk campaign.
  - >-
    A degree-three line pencil can have three complete selected fibers in one
    known-log path with d0=1; a universal pencil boundary floor is false at
    toy scale.
