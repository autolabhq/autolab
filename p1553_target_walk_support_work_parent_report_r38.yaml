summary: >-
  A deterministic search finds an exact degree-three elliptic line pencil
  whose three full selected fibers form one nine-point subgroup path under a
  known-log shift, with boundary one. Thus pencil geometry alone does not
  force the density-adjusted generic boundary. However, every explicit target
  walk that scans all entering and leaving translated endpoints pays work W
  and can be positive on at most |V|W random base masks. Repeating independent
  masks costs at least N/|V|=B^(3-o(1)) per scalar-blind hit. Small boundary
  lowers batch work only by clustering hits into proportionally rarer batches.
