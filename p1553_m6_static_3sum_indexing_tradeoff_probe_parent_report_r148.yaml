verified_statements:
  - >-
    Ignoring weights, the R147 occurrence-pair query is static
    3SUM-indexing on two identical length-B^(9/4) lists in the elliptic
    Cayley group; exact counts and atom marginals are stronger outputs.
  - >-
    The linear-state trivial scan costs B^(9/4) per target and B^(7/2)
    = N^(7/10) over the complete B^(5/4) target stream.
  - >-
    The Fiat-Naor-derived T*S^3=soft-O(n^6) curve instantiated at linear
    state gives query exponent n^3 and is dominated by the trivial scan.
  - >-
    The Dinur-Golovnev T*S=soft-O(n^(5/2)) improvement starts above
    n^(3/2) state and uses n^2 preprocessing, translating to B^(27/8)
    state and B^(9/2) preprocessing at the occurrence-list size.
  - >-
    The published decision or witness bounds do not supply exact integer
    multiplicities or A/C atom marginals and do not lower-bound a
    structure-aware elliptic autocorrelation circuit.
