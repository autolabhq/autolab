verified_statements:
  - Signed collinearity gives the exact P plus Q equals T condition off the diagonal.
  - The Q equals P chart requires the geometric curve tangent and cannot use the derivative of the interpolated V side table.
  - Six controls verify 68,326 signed factor biconditionals, including 5 tangent and 236 secant zeros.
  - Six controls verify 1,486 selected-Chow confluent derivative identities and 8,922 target dual-Chow evaluations.
  - Target-first and target-last products agree exactly and recover all 140 R166 verified roots without the opposite-sign Kummer branch.
  - The six represented target Chow forms fill all 204 slots, whose asymptotic N squared body is B to the 5 over 2 at rho.
  - The six represented selected Chow forms fill all 4,770 slots, whose asymptotic n squared body is B to the 9 over 2.
  - A fused factored dual-Chow outer norm modulo arbitrary squarefree U is not supplied.
