verified_statements:
  - >-
    Any retained target list admits a degree-N principal-divisor quotient h
    after adding one common zero and N auxiliary poles with matching group sum.
  - >-
    A generalized Miller line SLP compactly represents h in O(N) line merges;
    this is compact divisor state, not a fast resultant or restriction modulo U.
  - >-
    Weil reciprocity swaps the N-target Kummer product into a corrected product
    of h over S union -S, with candidate-zero rows handled by specialization.
  - >-
    Six controls verify 202 endpoint identities exactly: 62 disjoint-support
    rows and 140 candidate-zero specialization rows.
  - >-
    The finite controls use 1,486 direct target evaluations versus 17,844 raw
    swapped h evaluations; all auxiliary correction factors are units.
  - >-
    Raw swapped evaluation costs B^(9/2), and a standard represented elliptic
    resultant remains at B^(7/2), both above the B^(5/2) rho proxy.
