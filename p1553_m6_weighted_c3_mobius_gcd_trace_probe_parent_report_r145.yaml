verified_statements:
  - >-
    In a Cayley chart of the norm-one pairing torus, a target parameter
    induces a Mobius involution on C3 support parameters, and the common
    support is the gcd of one frozen support polynomial and its homogeneous
    target pullback.
  - >-
    The ordered weighted C6 count is exactly a quotient-algebra trace of the
    C3 weight interpolant and its target pullback; no root extraction or
    discrete logarithm is required.
  - >-
    All eight actual controls have exact support and weight polynomials,
    exact positive common-divisor degrees and traces, and exact zero results
    for sampled empty targets.
  - >-
    The standard dense coefficient route stores B^(9/4) support state but
    emits and processes B^(9/4) coefficients for each target, exceeding the
    B^(5/4) fresh cap.
  - >-
    Applying that route to the B^(1/2) A6 target batch costs B^(11/4),
    or N^(11/20), above Pollard rho; this is not a lower bound for implicit
    batched modular or data-structure routes.
