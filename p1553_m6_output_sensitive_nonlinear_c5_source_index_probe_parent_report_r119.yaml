verified_statements:
  - >-
    For an iid uniform deck in a prime cyclic group of order q>5, every
    distinct pair of canonical five-source multiplicity vectors collides
    with probability exactly 1/q.
  - >-
    The expected canonical-source collision count is binom(M,2)/q and
    endpoint-support deficiency is at most the collision count, yielding
    the stated Markov support bound.
  - >-
    At n=B^(3/4) and q=B^5, canonical C5 support is
    B^(15/4+o(1)) with probability 1-o(1), while expected collisions have
    exponent B^(5/2+o(1)).
  - >-
    Exhaustive q=11, n=3 enumeration exactly matches the pair-collision
    theorem and verifies the support-deficiency inequality on all decks.
  - >-
    All eight inherited R82 finite projective decks have injective
    canonical C5 endpoint maps, exact source replay, and exact empty-target
    rejection without consuming scalar labels.
  - >-
    Explicit endpoint dictionaries, radical/source selectors, and
    output-linear image compilers require B^(15/4+o(1)) random-deck output
    and exceed the B^(9/4+o(1)) setup cap.
