verified_statements:
  - >-
    Every nonempty proper deck in a prime cyclic group has nonzero
    characteristic-zero Fourier coefficient at every character.
  - >-
    The ordered six-A plus six-C target-count function consequently has
    full q-dimensional characteristic-zero translation-orbit rank.
  - >-
    Canonical six-A plus six-C source count is asymptotically at most
    q/(6!)^2, leaving a constant fraction approaching 1-1/518400 of target
    values at zero and forcing Omega(q) pole degree for a regular rational
    Boolean target section.
  - >-
    Two finite R82 controls have exact DFT factorization, sparse canonical
    endpoint support, and full auxiliary-field translation rank.
  - >-
    Dinur-Golovnev k=7 indexing on the original C deck needs state exponent
    33/8 at the online-compatible delta=1 endpoint.
  - >-
    Storing every five-C sum needs state exponent 15/4; both current routes
    exceed the frozen 9/4 setup cap while their query batches fit 5/4.
