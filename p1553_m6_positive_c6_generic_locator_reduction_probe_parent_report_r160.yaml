verified_statements:
  - >-
    Sampling C_i=[a_i]G+[b_i]Q with uniform a_i and nonzero b_i gives
    iid uniform generic group elements for every fixed DLP challenge Q.
  - >-
    A positive-C6 source for tG+[s_j]C_j gives the exact public row
    v-s_j e_j with known right-hand side t, and R159 supplies the
    all-column coverage and full-rank theorem.
  - >-
    Recovered factor logs give x=(ell_i-a_i)/b_i, so an encoding-invariant
    locator at the requested caps yields a q^(9/20+o(1)) generic DLP
    algorithm.
  - >-
    Shoup's Omega(q^(1/2)) classical generic-group lower bound excludes
    that locator interface by exponent gap q^(1/20)=B^(1/4).
  - >-
    R116 already supplies the C3+C3 source reduction and R148 already
    charges the B^(7/2) scan and B^(9/2) pair-table endpoints; R160 does
    not promote those prior facts as new.
  - >-
    Six finite public-curve controls cover every column, attain full rank,
    recover and verify all factor logs, recover and verify the embedded
    DLP, and verify identical descent using an explicitly over-cap C3 scan.
