summary: >-
  Every rational degree-three pencil on the R38 toy curve is represented by
  one of two subgroup-coset embeddings and one of 37,237 rational line-pencil
  centers. Exhaustive enumeration gives maximum complete three-point subgroup
  fiber coverage 51 in the subgroup class and zero in the other coset, while
  a degree-three by degree-three composition with nine selected outer values
  needs 81 covered points in 27 complete inner fibers. The original R38 pencil
  maps every one of 10,506 length-81 orbit intervals to at least 60 inner
  values, above the compositional maximum 27. Composition is closed on the toy;
  primitive degree-nine pencils remain open.
