verified_statements:
  - >-
    Every product-preserving fingerprint from a prime-order cyclic group is
    either trivial or injective.
  - >-
    Power maps z to z^k are directly computable without field DLP; the
    trivial map fails empty targets and every nontrivial map is a
    permutation of all q elements.
  - >-
    A finite tuple of homomorphisms is trivial when all components are
    trivial and injective otherwise.
  - >-
    Exact pure homomorphic fingerprints therefore retain image cardinality
    q=B^5, above the B^(9/4) setup cap for a full image table.
  - >-
    Prime-order controls have no intermediate image, while composite-order
    specificity controls expose proper quotient images.
