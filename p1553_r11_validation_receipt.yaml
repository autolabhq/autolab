  status: revise_scoped_theorem
  exact_normalization: >-
    The actual sign-closed S_6 existence predicate can be counted by a signed
    endpoint coefficient. Its zero set equals the projector zero set, its
    multiplicity differs by a factor between one and sixteen, and it remains
    below p under the frozen unique-color threshold.
  exact_new_boundary: >-
    A nonconstant degree-d_psi rational Kummer label cannot merge distinct
    source classes across a full B-point Cartesian second deck when
    B>16*d_psi and 2*d_psi<N. General selective collision incidences are
    O(d_psi^2*B), so the surviving useful degree range starts at sqrt(B).
  surviving_exception: >-
    A degree between sqrt(B) and B list-specific source-faithful Kummer
    transporter on a non-Cartesian recursive support, with bounded corrections
    and provenance, remains unconstructed and not excluded.
