verified_statements:
  - >-
    The bound v2 unequal-list theorem gives space n^(3/2-delta)m and query
    n^delta for integer lists of lengths n at most m.
  - >-
    Substituting n=B^2 and m=B^3 requires delta at least 15/8 for setup but
    delta at most 5/8 online; the online-bound point has B^19/4 space.
  - >-
    Every nonempty ten-deck partition fails setup; the best online-compatible
    theorem point has B^22/5 space and B^6/5 query.
  - >-
    The integer subfunction and translator report exact sources, while no
    proper additive residue quotient exists for a generic prime-order group.
