verified_statements:
  - >-
    Every algebraic-group morphism from a proper geometrically connected
    elliptic curve to G_m is constant and therefore the identity character.
  - >-
    The Weil pairing restricted to two inputs from the same cyclic subgroup
    is trivial by bilinearity and alternation.
  - >-
    Pairing against an independent q-torsion point with nontrivial generator
    image gives an injective character and an exact additive-five-sum to
    multiplicative-five-product equivalence with unchanged backpointers.
  - >-
    Pairing values require an extension containing mu_q of degree
    k=ord_q(p); one target character has at least linear-in-k base-field
    coordinate cost, so the frozen outer batch permits only k=B^(o(1)).
  - >-
    All eight R82 controls are supersingular j=0 embedding-degree-two
    fixtures; explicit reduced Tate evaluation gives nontrivial q-root
    characters, exact C5 product identities, source replay, and empty-image
    rejection without scalar labels.
  - >-
    Four exact prime-order finite curves have maximal embedding degree q-1,
    preventing the R82 k=2 behavior from receiving generic asymptotic credit.
