verified_statements:
  - >-
    The exact moment-simplex formula has
    M=binomial(p+r-2,r-1) composition channels and reconstructs every
    restricted Fermat-projector count from unary moments.
  - >-
    For fixed r>=2, literal moment-simplex construction has
    M=B^(5(r-1)+o(1)) channels. This rejects that representation only; quotient
    coincidences and cancellations prevent a rank or circuit lower bound.
  - >-
    The full F_p^r orthogonality kernel contains a p by p identity minor for
    r>=2. Every universally valid separated feature identity therefore has at
    least p terms.
  - >-
    The identity-minor theorem does not apply automatically to the nonlinear
    pair and target-triple signature images of the actual S_6 predicate.
  - >-
    Effective separated rank at most one has an exact unary zero-count router within
    B^(1+o(1)) setup/state and B^(o(1)) target replay.
  - >-
    The zero-coefficient rank-zero branch has direct integer count
    product_i|I_i| and is incompatible with the full-size 32*B^4 geometric
    bound whenever that box size exceeds 32*B^4.
  - >-
    With two nonzero coefficients, the 4^5 unary zero strata are handled by
    unary status counts, and the all-nonzero stratum reduces to exact sparse
    multiplicative convolution of two B^2 dyadic pair histograms evaluated at
    B target-scaled points.
  - >-
    All dyadic pair histograms have B^(2+o(1)) total occurrence entries because
    each pair belongs to O(log^2 B) ancestor rectangles.
  - >-
    Literal moments, explicit triple scanning, dense character transforms,
    represented multivariate evaluation, and the named rational, matrix, and
    tensor routes expose an object above a direct cap, without excluding an
    implicit actual-image pullback circuit.
