exactly_one_next_action: >-
  Prove or refute exact summation of h_I(V_R(a_3,a_4,a_5)) in one frozen
  factorized-circuit grammar for the actual separated S_6 signatures, on the
  full box and every adaptive dyadic child, without emitting B^3 values or
