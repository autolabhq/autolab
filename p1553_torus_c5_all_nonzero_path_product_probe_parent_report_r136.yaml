verified_statements:
  - >-
    The all-nonzero path of a polynomial zero-test decision tree is
    represented exactly by the nonvanishing of the product of its node
    polynomials.
  - >-
    A rejecting all-nonzero leaf forces the path product to vanish on the
    full positive support, while an accepting leaf forces the node root
    union to cover the full complement.
  - >-
    Every exact structured tree has path-product support above six or a
    root-cover budget at least q minus the color support size.
  - >-
    Under the frozen uniform-random-deck model, the path-product threshold
    becomes (5-o(1))*log2(q) with overwhelming probability.
  - >-
    Twelve finite controls replay five linear factors, an exact six-mode
    product, one surviving positive, one inverse empty on the same path,
    and all associated C5 sources.
