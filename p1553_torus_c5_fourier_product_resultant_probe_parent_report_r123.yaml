verified_statements:
  - >-
    Multiplicative characters chi_j(z)=z^j are directly computable on
    pairing images, and the q-mode inverse Fourier identity returns the exact
    ordered five-product count without field discrete logarithms.
  - >-
    On all eight R82 controls, the ordered moment equals the
    occurrence-weighted support moment and its Berlekamp-Massey order equals
    the full distinct C5 support.
  - >-
    The ordered product polynomial satisfies
    P_(a+b)(Y)=Res_X(P_a(X),X^deg(P_b)P_b(Y/X)).
  - >-
    A synthetic q=11 subgroup verifies all Fourier counts, positive and empty
    membership, and exact equality of the P2|P3 resultant and direct P5
    evaluation.
  - >-
    Full Fourier uses B^5 modes, sparse recurrence uses B^(15/4) state,
    represented target P2|P3 resultant work is B^(9/4), and symbolic P5 has
    B^(15/4) output.
