verified_statements:
  - >-
    A uniform degree-below-N polynomial in the target-label algebra gives
    independent uniform randomizers at all N public target labels, regardless
    of target-coordinate collisions.
  - >-
    The linear residual a_j+r_j*b_j has no false negatives and gives each
    regular nonmatch false cancellation probability at most 1/p.
  - >-
    The probability that any of the nN regular nonmatches enters the union is
    at most nN/p=B^(-3/2), and direct B^2 expected verification makes the
    returned factor exact.
  - >-
    A forced r=-a/b control creates a false root, which direct group-law
    verification removes without losing any true R163 union root.
  - >-
    The incidence factor gcd(U,product_j(X-x(T_j))) and x-bucket verification
    cost B^(9/4+o(1)) and preserve the positive tangent exception.
  - >-
    The standard represented coefficient-ring target norm costs B^(7/2),
    above rho; no output-sensitive elliptic-translation norm is supplied.
