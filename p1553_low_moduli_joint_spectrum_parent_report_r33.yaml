theorems:
  - >-
    The degree-c morphism space on a fixed elliptic curve has dimension at
    most 2c; adding c values and c shifts gives total dimension at most 4c.
  - >-
    The canonical finite-field family has p^(4c+o(c)) instances and cannot
    injectively encode 2^(2c^2) arbitrary Boolean-matrix pairs without
    Omega(c^2) extra advice bits.
  - >-
    Arbitrary ordering of c^2 selected points has Theta(c^2 log c) bits and
    is therefore a forbidden hidden-advice channel.
  - >-
    The complete histogram is the joint spectral measure of multiplication
    by g and its run-compressed partial translation conjugates in a split
    algebra of dimension c^2.
