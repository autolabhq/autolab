summary: >-
  On a fixed elliptic curve, a degree-c map, c selected values, and c shifts
  have only O(c) field parameters and p^(O(c)) canonical instances. At
  p=c^(5+o(1)) this is 2^(O(c log c)), too little to encode arbitrary pairs
  of c by c Boolean matrices without Omega(c^2) extra advice bits. Arbitrary
  ordering of the c^2 selected points can hide that advice and must be
  canonicalized. The actual complete histogram is the joint spectral measure
  of multiplication by g and its c run-compressed partial translation
  conjugates in the split selected-divisor algebra of dimension c^2. Standard
  explicit, norm, and characteristic-polynomial routes restore c^3 traffic;
  an output-sensitive elliptic joint-spectrum algorithm remains open.
