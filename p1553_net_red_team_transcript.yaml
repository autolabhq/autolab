  statement: >-
    The corrected shifted net term has the intended relation-zero support on
    the nondegenerate chart, but standard component recurrences do not induce
    a closed recurrence on the diagonal product over Theta(B^4) mixed seeds.
    Individual mixed state costs B^4; the strongest fixed-label resultant
    surrogate costs B^2 online and already exceeds the B^(5/4) cap. Raw unit
    values are gauge-dependent, complete strata and no-relation replay remain
    mandatory, and no unknown aggregate circuit is ruled out.
