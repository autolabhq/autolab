frozen_interface:
  group_order: N=p^(1+o(1))
  label_bound: B=N^(1/5)
  exact_count_threshold: 32*B^4<p
  setup_and_state_cap: B^(9/4+o(1))
  online_and_workspace_cap: B^(5/4+o(1))
  output: exact restricted miss or one verified signed occurrence-labelled source
verified_statements:
  - >-
    If every colored deck contains each global x-class at most once, fixing
    four legal occurrence labels and the 2^4 source signs determines at most
    one fifth x-class. Thus 16*min_j(product_(i!=j)|I_i|) is valid and 32*B^4
    is a conservative frozen bound. Within-color multiplicity must be charged.
  - >-
    Above the explicit threshold 32*B^4<p, the algebra trace of
    chi_(R,I)=1-F_R^(p-1) is the exact integer restricted root count, not only
    its residue modulo p.
  - >-
    Exact restricted counts support one-source recovery in at most
    1+5*ceil(log_2 B) count calls while preserving occurrence labels, sign
    closure, complete verification, and repeated-column aggregation. The
    converse from one source to exact multiplicity is not claimed.
  - >-
    The pseudoinverse and projector identities are exact, but Frobenius is the
    identity on the split F_p quotient and supplies no source-atom recurrence.
  - >-
    In CRT coordinates the projector has CP rank at most the root count and
    F_R^(p-1) has CP rank at most the root count plus one. Sparse useful fibers
    therefore rule out a universal large projector-flattening obstruction.
  - >-
    A supplied target-fresh A-term CP projector gives all dyadic counts in
    A*B^(1+o(1)) factor-construction work and A*B^(o(1)) replay. The direct
    fresh-target cap requires A<=B^(1/4+o(1)) for that implementation.
  - >-
    If all CP factor vectors and interval sums are target-independent and only
    A weights specialize, setup/state costs A*B^(1+o(1)) and target replay
    costs A*B^(o(1)), conditionally allowing A<=B^(5/4+o(1)).
  - >-
    Carry rank changes under integral lift replacement tilde(F) by
    tilde(F)+pL, so carry-rank obstructions are scoped to a frozen lift and
    arithmetic schedule.
  - >-
    Literal Fermat-power expansion and standard CRT, quotient, norm, and
    balanced routes do not construct a cap-sized exact trace evaluator.
scoped_positive_controls:
