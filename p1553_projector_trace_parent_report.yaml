  exact_projector_count: true_above_threshold
  dyadic_source_replay: at_most_1_plus_5_ceil_log2_B_count_calls
  supplied_cp_direct_rank_cap: A<=B^(1/4+o(1))
  supplied_target_independent_cp_rank_cap: A<=B^(5/4+o(1))
  projector_rank_upper_bound: z_(R,I)
