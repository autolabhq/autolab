verified_statements:
  - Semaev S3 has the exact elementary-symmetric 2 by 2 determinant form stated by the R173 producer.
  - Six controls verify 68,326 evaluated determinant identities and 1,486 separable discriminant identities.
  - The coefficient-matrix commutator is diag(delta,-delta) with delta equal to 4(b-Xu(X+u)).
  - All 1,675,890 tested distinct-root pencil pairs and all 118 target-factor pairs are noncommuting.
  - Forward and reverse target products differ in every control, while both determinants replay the corresponding R172 reverse resultant exactly.
  - The six represented transfer matrices reserve 1,448 coefficient slots, use 1,418, and have coefficient-rank sum 184.
  - Represented 2 by 2 transfer state costs B^(5/2), exactly the rho proxy before the outer self-resultant.
  - Diagonalizing through the known discriminant square root returns the two R172 target-sign branches rather than a new compact branch.
