summary: >-
  The ordered complete triples of one degree-c elliptic map lie on an
  irreducible repeated-addition surface with coordinate degrees at most
  4c^2,c^2,c^2. Restricting to c fixed shifts gives a reduced union of
  genus-one image curves of total Segre degree at most 3c^2, an actual
  low-moduli escape from the generic matrix instance. Materializing the
  surface or curve equations on the c^3 selected value grid, or taking a
  graph-first source norm, restores c^3 traffic. A deterministic x-coordinate
  control also shows that the naive affine recursive fourth-resultant misses
  valid proper-subsum infinity strata. A saturated radical-first selected-
  shift curve compiler remains open.
