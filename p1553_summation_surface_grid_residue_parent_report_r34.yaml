theorems:
  - >-
    The repeated-addition image of (P,B) mapped to
    (g(P),g(B),g(2P-B)) is an irreducible hypersurface with coordinate
    degrees at most 4c^2,c^2,c^2.
  - >-
    Each fixed nonzero shift gives a birational genus-one triple-image curve
    of Segre degree 3c, so the reduced union over c shifts has degree at most
    3c^2.
  - >-
    The explicit selected value grid algebra has dimension c^3; materialized
    grid residues and graph-first source norms therefore restore cubic
    represented traffic.
  - >-
    The addition surface does not enforce membership of the recovered shift
    in the selected shift divisor and does not return a coupled source.
  - >-
    A naive affine recursive fourth-resultant can miss valid proper-subsum
    cancellation strata whose intermediate point is infinity.
