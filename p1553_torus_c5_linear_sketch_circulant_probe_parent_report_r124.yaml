verified_statements:
  - >-
    Ordered C5 counts are translated inner products between the C3
    occurrence vector and the C2 occurrence kernel.
  - >-
    A universal linear sketch with linear exact-count decoding for every
    target needs at least the rank of the C2-kernel circulant.
