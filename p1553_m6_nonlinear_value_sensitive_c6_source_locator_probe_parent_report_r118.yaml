verified_statements:
  - >-
    The ordered six-C count is exactly the sum over one distinguished C
    atom of the five-C count at the translated target.
  - >-
    Enumerating one C atom over the B^(1/2) A6 target batch consumes the
    entire B^(5/4) fresh cap, so the residual five-C query must be
    polylogarithmic.
  - >-
    No occurrence-materialized one-side C^s split table simultaneously
    meets setup and batch caps: s<=3 is required by setup while s>=5 is
    required by online work.
  - >-
    Two finite projective controls give exact one-C plus C5 and all binary
    split counts on positive, repeated-atom, empty, and identity targets,
    with exact source replay.
  - >-
    Current bound k=6 indexing at zero query exponent requires state
    B^(33/8), while a C2 scan against C3 gives B^(11/4) full batch work.
  - >-
    Standard five-variable deck quotients and all-grid evaluation have
    represented dimension B^(15/4); explicit C2/C3 truncated resultants
    retain a B^(9/4) degree body per five-C query.
