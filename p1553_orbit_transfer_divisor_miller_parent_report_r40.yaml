summary: >-
  Moving the selected-path locator poles onto the subgroup orbit gives an
  exact multiplicative translation coboundary with the same subgroup zero
  set. A length-L simple zero interval forces at least L transfer-support
  points and transfer degree Omega(L^2), so standard explicit-support
  generalized Miller evaluation costs Omega(L). At L=B^2 this is B^2 work,
  above the density-adjusted target gate. An exhaustive order-103 toy dynamic
  program proves minimum transfer degree 21 and support 19 for the R38
  nine-point interval. Single Miller functions, division polynomials, and
  proper-kernel isogeny norms have the wrong support geometry. A new
  partial-orbit product identity and a second-level marked outer locator remain
  open.
