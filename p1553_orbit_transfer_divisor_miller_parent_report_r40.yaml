theorems:
  - >-
    A subgroup-supported principal transfer divisor gives an exact
    multiplicative coboundary locator with simple zeros on the selected path
    and no other subgroup zeros.
  - >-
    A length-L simple zero interval forces transfer support at least L and
    transfer degree Omega(L^2).
  - >-
    Standard generalized Miller evaluation over explicit transfer support has
    Omega(L) work even with a balanced merge tree.
  - >-
    In a prime-order subgroup, division-polynomial torsion support and proper
    isogeny-kernel norms cannot equal a proper consecutive interval.
