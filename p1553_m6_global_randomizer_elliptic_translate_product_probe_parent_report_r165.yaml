verified_statements:
  - >-
    One uniform scalar randomizer retains the nN/p=B^(-3/2) union bound;
    target-wise independence is unnecessary.
  - >-
    The function f_r(Q)=U(x(Q))+r(y(Q)-V(x(Q))) vanishes at every signed C3
    endpoint and has exact pole order and zero-divisor degree 2n.
  - >-
    Every affine randomized residual is one translate f_r(T_j-P), including
    tangent x-incidence; only P=T_j maps to the pole O and is regularized to
    semantic factor one.
  - >-
    Six global-randomizer controls retain every true root and verify to the
    exact R163 union; a forced correlated false root is removed.
  - >-
    The explicit arbitrary-target translate product has zero and pole divisor
    degrees 2nN=B^(7/2), above rho; no output-sensitive remainder constructor
    is supplied.
