verified_statements:
  - The principal target function h vanishes on a selected pair sum exactly when the positive signed target incidence holds.
  - All 8,922 selected pair sums avoid the auxiliary poles and exactly 241 are incidences.
  - The 241 incidences split into 5 diagonal and 236 off-diagonal cases and produce all 140 R175 roots.
  - The principal subset scalar replays all 358 R175 balanced-tree query zero patterns.
  - Every queried Pontryagin cycle has degree mn and group sum n sum A plus m sum D.
  - All 358 completed generalized Miller and Weil-reciprocity scalar identities are exact.
  - The reciprocity controls contain 42 literal disjoint-support identities and 316 candidate-specialized zero identities.
  - Standard represented Pontryagin-cycle and completed Miller routes retain n squared state at B to the 9 over 2.
