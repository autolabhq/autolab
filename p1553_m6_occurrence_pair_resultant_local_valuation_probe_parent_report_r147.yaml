verified_statements:
  - >-
    Retaining all ordered C3 occurrences as repeated roots gives an
    occurrence divisor of degree |C|^3, while the local valuation of its
    implicit pair resultant at a target equals the direct ordered C6 count.
  - >-
    All repeated-root multiplicities, twelve positive target valuations,
    and six empty target valuations replay exactly on each of eight actual
    controls without a candidate root or DLP oracle.
  - >-
    The full pair resultant has formal degree |C|^6 but is never
    materialized or charged as a candidate artifact.
  - >-
    The Moroz-Schost soft-O(d*k) truncated-resultant bound charges one
    bounded-order local target at B^(9/4), one known-target A6 batch at
    B^(11/4), and the complete standard relation stream at B^(7/2)
    = N^(7/10).
  - >-
    Those charges close only independent componentwise or direct-product
    use of the cited algorithm; they are not a lower bound for a genuinely
    shared transposed multi-target valuation-and-marker operator.
