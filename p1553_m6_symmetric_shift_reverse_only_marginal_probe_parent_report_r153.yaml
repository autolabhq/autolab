    Row sums recover six times each count and the corrected known-shift
    relation equations are exact in all eight finite controls.
  - >-
    The eight finite stacked ranks are 4,0,0,0,0,0,0,0; no full-rank control
    or verifier-only factor-log solve is admitted.
  - >-
    The B^(3/4) relation-count estimate is uniform-model-only and has no
    structured generic-prime transfer.
