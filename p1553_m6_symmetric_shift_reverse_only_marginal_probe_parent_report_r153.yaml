  - >-
    A public known-log A deck and inversion-closed C deck preserve the
    selected M6 exponents and give symmetric A6 shifts and an even C5 kernel.
  - >-
    Every marginal block satisfies D_s^T=D_(-s), so opposite-shift reverse
    actions supply forward actions without a separate tangent operator.
