verified_statements:
  - >-
    The exact Mobius-character product defect is a fixed-degree rational
    function of the unknown C2 operand, and every defined value replays on
    all eight frozen controls.
  - >-
    In a prime-order group, a total product law computed only from operand
    signatures forces the signature to be constant or injective.
  - >-
    Two controls admit no deterministic composition for any nonempty
    deck-parameter subset; in the other six, the minimum deterministic
    table recreates every C2-by-C3 operand pair.
  - >-
    An ideal projected two-pair merge that emits enough explicit rank rows
    has total exponent at least max(beta,1-beta), minimized at one half.
  - >-
    The finite table comparisons and explicit-row model receive no credit
    against implicit relation-span operators or general ECDLP algorithms.
