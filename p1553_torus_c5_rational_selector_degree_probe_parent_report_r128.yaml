verified_statements:
  - >-
    A nonconstant rational C2 selector of degree d can output any fixed C2
    value on at most d targets, forcing d at least |C5|/|C2|.
  - >-
    Under the inherited iid-distinct-support exponents, the rational
    selector degree is at least B^(9/4).
  - >-
    Dense degree-B^(9/4) coefficients fit setup exactly but represented
    arbitrary-target evaluation misses the polylogarithmic query cap.
  - >-
    All eight actual canonical selectors interpolate exactly, return
    replayable C2+C3 sources, and have unique interpolation degree |C5|-1.
