  For a fixed denominator section, point-pair fiber collisions are linear
  equations in the numerator modulo the denominator. Seven independent rows
  isolate one pencil; dropping one row leaves a projective line of exactly 194
  pencils, all of which R47 enumerates. An eight-layer width-32 beam for both
  orientations of the strongest R46 pair generates 611,100 slice instances
  and scores 576,607 layer-unique candidates. Neither orientation improves the
  seed's two complete fibers and 106 collision pairs. Other denominators and
  pencils outside the finite beam remain open.
