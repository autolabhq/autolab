summary: >-
  R27 branch B yields Theta(B) shifts whose transition matrices between B
  selected fibers have Theta(B^2) occupied cells and only o(B^2) repeated
  normalization cells. These are partial orthogonal fiber grids. Exact full
  coverage for one nonzero shift would make the B^2-point support invariant
  in a prime-order group and is impossible. A curve capturing a constant
  fraction of one good transition grid must have total bidegree Omega(B).
  Affine-plane parallel classes attain the abstract orthogonal-partition
  scale but use an unavailable rank-two additive chart. The approximate
  partial design and compact complete two-branch compiler remain open.
