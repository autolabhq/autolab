theorems:
  - >-
    Branch B contains Theta(L) shifts with Theta(c^2) occupied transition
    cells and o(c^2) repeated cells, hence Theta(c^2) singleton fiber
    intersections per good shift.
  - >-
    If r=c, z=c^2, and every value pair is represented exactly once for one
    nonzero shift, then Z is translation invariant and must equal the whole
    prime-order group, contradicting c^2<N.
  - >-
    A bidegree-(u,v) curve not containing the integral bidegree-(c,c)
    translate curve captures at most c(u+v) selected normalization points;
    a constant fraction of a good grid requires u+v=Omega(c).
  - >-
    A single-valued value router agreeing on Theta(c^2) points has degree
    Omega(c), unless it is a forbidden global translation semiconjugacy.
  - >-
    The c+1 parallel classes of an affine plane give extremal pairwise
    orthogonal partitions of c^2 points, but require an external rank-two
    additive chart unavailable in the prime cyclic source group.
