verified_statements:
  - >-
    The normalized four-minor determinant factors into five excluded
    factors and one explicit Mobius-claw factor.
  - >-
    Order-two Frobenius makes the Mobius map an involution on norm-one
    values, but does not reveal the integer exponent of its image.
  - >-
    All twelve available actual color progressions admit bounded
    known-mode claws whose minors have rank three.
  - >-
    Every actual kernel polynomial has four nonzero coefficients and
    vanishes on exactly rows zero, one, three, and four among the six
    checked progression sources.
  - >-
    The standard q-to-one-half collision or generic DLP baseline is
    B-to-five-halves, above the B-to-nine-fourths setup cap.
