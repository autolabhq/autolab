verified_statements:
  - The nested Fermat-projector trace equals the sum of target-chart gcd degrees.
  - Total target degree below the characteristic prevents nonzero multiplicity cancellation.
  - Nonzero multiplicity support equals candidate source support in all thirteen controls.
  - Weighted Hankel rank and Berlekamp-Massey order equal the candidate degree.
  - Two candidate-degree moments recover the exact candidate locator in all controls.
  - The new strided divisor control is checked by an independent elliptic group-law comparator.
  - A source-row swap preserves every tested global target power sum but changes the candidate locator.
  - The represented tensor and A-linear target-Krylov routes retain nN scale.
