draft_research_result:
  status: review_required_conditional_positive
  degree_one_component_boundary: >-
    Every direct or swapped degree-one cross-endpoint component is a deck
    double-coset graph. On the prime-order subgroup its translation offset
    vanishes, leaving only an origin-fixing automorphism orbit of at most three
    Kummer classes. This cannot provide polynomial compression.
  polynomial_family_boundary: >-
    For polynomial psi, the projective branch-infinity hyperplane pulls back
    to 2d*[x(A)]. A nontrivial common factor must be totally ramified at every
    endpoint in the block. Riemann-Hurwitz permits at most two, so no growing
    balanced polynomial block exists.
  value_fiber_boundary: >-
    For every output value c, if r_c is the support size of psi^(-1)(c), then
    every degree-e block factor obeys
    m*max(0,e-2r_c)<=8r_c*(e-1) and
    r_c>=m*e/(2m+8(e-1)). Balanced factors therefore require Omega(d)
    support in every value fiber.
  output_coordinate_boundary: >-
    Sym^2(M) relabels complete branch outputs under every output Mobius map M,
    so a sparse exceptional fiber cannot be hidden by making the infinity
    fiber generic. This closes disguised polynomial/power maps and the
    unbounded cyclic/dihedral tame Galois quotient families.
  field_direction_guard: >-
    A common right factor is governed by the compositum
    k(T_A,V_A:A in H_z), not the intersection of the coordinate fields. The
    q^2/q^3 control has nonconstant intersection k(q^6) but compositum k(q),
    so every intersection-only certificate is a false positive.
  pairwise_kill_sieve: >-
    A degree-e common right factor forces e to divide the generic degree of
    every paired complete trace/norm map. One fully saturated pair that is
    birational onto its image rejects every nontrivial factor for the block.
  conditional_compiler: >-
    A complete common right factor pi_z for every endpoint in one psi block
    gives setup O~(S+sum_z[L+e_z+m_z(J_z+d/e_z)+v_z]) and state
    O~(S+sum_z[J_z+m_z*J_z]). Under balanced blocks, degree, attained fifth
    image, and compact certificates, both become O~(S+SL/d), at most B^(9/4)
    in the surviving degree range.
  containment_and_source: >-
    Exact all-chart identities F_A=G_A*pi_z plus the attained pi_z deck image
    certify containment. Fifth dyadic histograms and the inherited pair
    dictionary answer a queried complete-key child in O~(d) work with exact
    integer count and one jointly coupled occurrence source.
  positive_control: >-
    Isogeny and Lattes maps supply exact common factors, but on the target
    prime-order subgroup they are injective: endpoint blocks have size one and
    the fifth image has J_z=L. Composite torsion passes the compression
    premises but fails the group gate.
  surviving_exception: >-
    No explicit non-isogeny balanced block factor or compact all-chart
    certificate is known. Fresh-target action, query-sensitive R10, density,
    independent rank, factor logs, and blind descent also remain absent.
