research_result:
  status: revise_scoped_compiler
  exact_new_boundary: >-
    For the complete short-Weierstrass Kummer branch, the two local labels are
    roots of an explicit quadratic H_(u,q), and substituting the degree-d map
    psi gives a complete local image divisor with an O(d^2) dense chart
    description. This is a compact map description, not a construction over
    all S*L source pairs.
  exact_decoder: >-
    Given exact image size K and ordinary trace moments s_0 through
    s_(2K-1), with nonzero geometric multiplicities below p, the K-by-K
    Hankel matrix is a weighted Vandermonde Gram matrix and is nonsingular.
    Fast Pade or Hankel reconstruction therefore recovers the squarefree
    image minimal polynomial in K^(1+o(1)) field operations. Weighted and
    key-coordinate moments then recover occurrence weights and complete keys.
  completeness_and_source_split: >-
    A finite moment prefix does not certify completeness without exact K,
    annihilation or containment, or an exact stopping rule. Source-marker
    moments return fiber sums rather than one jointly coupled pair/fifth
    source; complete per-fiber source polynomials have total degree S*L.
  standard_constructor_boundary: >-
    Split evaluation, quotient-Krylov, nested norms, sparse resultants,
    multiplication matrices, direct stencils, and per-slice unions expose the
    S*L=B^3 source algebra or traffic. Fifth-first dense elimination costs
    d*L^2, at least B^(11/4) in the surviving degree range. These are
    grammar-specific charges, not unrestricted lower bounds.
  positive_controls: >-
    Additive and multiplicative maps admit factored moment construction, and
    a one-sided hash plus L-scan admits exact counts and one source. P1510 and
    structured torsion or progression controls likewise prevent generalizing
    the negative result beyond the actual Kummer branch grammar.
  surviving_exception: >-
    A compact tensor-trace constructor for the actual Kummer branch map that
    emits ordinary, weighted, key, containment, jointly coupled source,
    adaptive-child, fresh-target, and R10 rank-two answers without an S*L
    vector, d*L^2 dense resultant, d^2 online join, or unproved stopping rule
    remains unconstructed and not excluded.
