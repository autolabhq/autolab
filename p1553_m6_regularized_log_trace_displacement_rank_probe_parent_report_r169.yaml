verified_statements:
  - >-
    The lambda-adic valuation at zero of the scalar resolvent equals the R168
    candidate multiplicity because every inherited witness denominator is a unit.
  - >-
    All six finite pencils are monic of degree 2n and recover exactly the R168
    candidate roots and multiplicities.
  - >-
    Six ordinary diagonal x/y Sylvester and Stein displacements have full row
    rank on all six controls; x-Sylvester powers one through four do as well.
  - >-
    A two-seed degree-two-through-eight sweep on the largest curve gives full
    rank for both the raw kernel and ordinary x-Sylvester displacement.
  - >-
    Generic pencil interpolation and a full-rank displacement generator each
    require B^(9/2) state, above the B^(5/2) rho proxy.
