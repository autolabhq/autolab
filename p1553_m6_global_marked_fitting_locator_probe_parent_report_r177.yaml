verified_statements:
  - The global marked norm is the determinant of K plus lambda times A I minus X1 on the reduced pair algebra.
  - The lambda valuation equals the signed-incidence kernel dimension in all six controls.
  - The first nonzero coefficient is the pseudodeterminant of K times the product of A minus x(P) over all signed-incidence pairs.
  - Monic normalization gives the characteristic polynomial of X1 restricted to ker K.
  - The six kernel dimensions sum to 241 and the marker polynomial degrees sum to 241.
  - One gcd with squarefree U recovers all 140 distinct R176 candidate roots without subset queries.
  - All 247 interpolation samples and 28,788,282 truncated lambda updates are fully charged finite controls.
  - Standard pair-algebra, full determinant-body, and explicit interpolation routes remain above rho.
