verified_statements:
  - >-
    Reducing psi modulo the quadratic S3 branch algebra and taking trace and
    norm represents the complete branch key by constant-many bivariate
    rational functions of bidegree O(d), for O(d^2) dense chart coefficients.
  - >-
    On a short Weierstrass chart the two x(A plus or minus Q) coordinates are
    roots of one explicit quadratic H_(u,q). The resultant of H with
    Q_psi(X)*Y-P_psi(X) is quadratic in Y and gives an exact constant-branch
    local compiler before projective saturation.
  - >-
    For a separating image coordinate a, ordinary trace moments satisfy
    s_j=sum_y m_y*t_y^j with 1<=m_y<=8d^2<p. The K by K Hankel determinant is
    product_y(m_y) times the squared Vandermonde and is nonzero.
  - >-
    Given certified K and moments through index 2K-1, fast Hankel or Pade
    reconstruction returns the exact squarefree image minimal polynomial.
    Vandermonde solves recover geometric multiplicities, occurrence weights,
    and every complete-key coordinate constant on image fibers in O~(K).
  - >-
    A finite moment prefix does not certify that no additional image state was
    omitted without a valid K upper bound, P(a)=0 identity, compressed
    containment proof, or another exact stopping rule.
  - >-
    Source-marker traces recover sums over each image fiber. They do not select
    one joint pair/fifth preimage on a multiple fiber; standard complete
    fiber-polynomial recovery has total degree S*L.
  - >-
    Standard split evaluation, nested or sparse resultants, represented
    quotient minimal polynomials, Krylov, power projection, bihomogeneous
    multiplication maps, per-slice unions, and dense repeated powers expose
    S*L represented traffic in the frozen grammar.
  - >-
    Additive and multiplicative Cartesian maps have exact factorized moment
    compilers. Under a certified K promise, their distinct image polynomial
    and multiplicities are output-sensitive; an S-side hash and L-scan give
    exact count and one source in O(L) online work.
  - >-
    P1510 and the composite-torsion quotient are further exact positive
    controls. They prevent an unrestricted claim against resultants, tensor
    traces, uniform fibers, or family-specific compilers.
  - >-
    A full product histogram can have B^4 support in the R10 rank-two control,
    while only B shifted values are queried. The trace image decoder therefore
    does not supply the required query-sensitive sparse convolution.
