verified_statements:
  - >-
    Atom-restricted t-column full spark bounds one t-mode node by
    (t-1)*m^4 ordered five-source tuples and forces rejecting-path depth
    at least ceil(m/(t-1)).
  - >-
    For trinomials, the conditional structured lower bound is
    B^(3/4+o(1)); product collisions do not weaken the tuple pullback.
  - >-
    The corrected finite-field Chebotarev corollary requires primitive
    characteristic order, while every actual family has order two.
  - >-
    Forcing primitive order requires extension degree
    q-1=B^(5+o(1)), exceeding the setup cap.
  - >-
    Two exact all-mode three-atom controls and 73,920 bounded-window
    minors are nonsingular, but receive no asymptotic colored credit.
