verified_statements:
  - >-
    For prime q, Q[C_q] splits as Q times Q(zeta_q), so its nonzero unital
    quotient dimensions are 1, q-1, and q; augmentation is the only
    one-dimensional quotient.
  - >-
    For deck element U and multiplier stabilizer H_C, the cyclotomic
    conjugate degree is exactly (q-1)/|H_C|.
  - >-
    A campaign deck containing a nonzero atom satisfies |H_C|<=|C|, so a
    reusable multiplication-closed representation containing U has
    dimension at least (q-1)/|C|=B^(17/4-o(1)).
  - >-
    All eight actual finite decks have trivial multiplier stabilizer and
    exact same-augmentation shifted-deck witnesses with different selected
    C6 counts.
  - >-
    Verifier-only BSGS labels receive no candidate or asymptotic credit, and
    the theorem does not cover fixed-depth nonhomomorphic U^6 circuits.
