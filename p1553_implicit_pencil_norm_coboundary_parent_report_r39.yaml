summary: >-
  The exact translated product A_V(R)=product_v F_C(R-v) decides the marked
  endpoint intersection, but its dense norm has degree B^4 and any
  constant-success materialized batch radical has at least B^3 support.
  Standard norm, resultant, quotient, divisor, radical, and post-hoc gcd
  representations therefore miss the density-adjusted B^(1/2) fresh-target
  gate. The exact R38 toy locator is not a translation coboundary, its naive
  degree-nine composition has 66 inner values where at most 27 are allowed,
  and all 4,896 nondegenerate arithmetic pair decks have norm cyclic linear
  complexity 102 in a subgroup of order 103. A special high-degree Miller/net
  circuit or source-returning nonlinear locator remains open.
