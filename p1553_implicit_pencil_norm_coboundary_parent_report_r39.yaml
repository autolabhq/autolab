theorems:
  - >-
    The translated norm is an exact endpoint-intersection predicate and has
    rational-function degree at most B^4 counting multiplicity.
  - >-
    A constant-success materialized batch radical needs at least B^3 distinct
    shifted endpoints, while smaller batches inherit R38 support/work
    cancellation across independent masks.
  - >-
    A multiplicative q-coboundary has zero valuation mass on every q-orbit;
    the R38 rational locator has mass nine on the subgroup orbit and therefore
    is not a coboundary.
  - >-
    Any q-coboundary primitive with zeros on a pole-free length-L interval has
    transfer divisor degree Omega(L^2), hence Omega(B^4) at L=B^2; no circuit
    size lower bound is claimed.
  - >-
    The naive degree-nine composition fails the necessary inner-value
    saturation condition, 66 distinct inner values versus a maximum of 27.
