verified_statements:
  - >-
    For a proper nonempty binary deck in a prime-order cyclic group, every
    characteristic-zero Fourier mode of the deck polynomial is nonzero by
    the prime cyclotomic divisibility criterion.
  - >-
    The actual ordered C6 count sequence u^(*6) therefore has all q Fourier
    modes and cyclic shift-Krylov dimension q.
  - >-
    Each exact C-atom marginal is 6 times a shift of u^(*5), so every atom
    marginal also has all q Fourier modes and shift-Krylov dimension q.
  - >-
    All eight actual decks satisfy the theorem hypotheses, and verifier-only
    BSGS labels give exact torus-to-scalar C6 multiplicity replays with
    support sizes 28, 210, 462, and 924.
  - >-
    At q=B^5, constant-coefficient count or shared marginal recurrence
    state exceeds the B^(9/4) setup cap and rho, without implying a lower
    bound for nonlinear or implicit FFE circuits.
