verified_statements:
  - >-
    Summing all ordered six-factor relations in a known-target fiber gives
    one exact known-RHS equation in the |A|+|C|-1 meaningful log
    coordinates.
  - >-
    Fiber count is the all-one specialization of a weighted relation
    polynomial, and atom occurrence marginals are its logarithmic first
    derivatives.
  - >-
    Once factor logs are known, the same count and marginals recover a
    positive target log and support known-shift identical descent without
    opening an individual source.
  - >-
    All eight actual controls have full meaningful aggregate rank and exact
    finite factor-log, positive-target, shifted-target, empty, and source
    semantic replay.
  - >-
    The B^(9/4)=N^(9/20) precomputation envelope is conditional on a
    weighted count index, reusable offline/online transposed derivative
    state, structured rank and density, and complete projective bit costs.
