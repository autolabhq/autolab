summary: >-
  A dense fixed fifth-shift slice has Omega(B^2) distinct oriented complete
  keys by the translate curve normalization-defect bound and can be enumerated
  with exact coupled sources in O(B^2) work. O(log B) random slices recover
  all keys occurring on a constant fraction of shifts and miss only a
  controlled source-mass fraction. If relation sources are restricted to the
  scanned shifts, however, s shifts give random-target success at most
  O(s/B). Under the B^(9/4) setup and B^(5/4) direct online caps, literal
  slices imply campaign exponent at least 3/5. Exploiting unscanned source
  mass requires a new marked source-fiber locator.
