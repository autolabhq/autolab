theorems:
  - >-
    One shift slice has second moment below 3c^2, so any slice with
    alpha*c^2 complete sources has at least alpha^2*c^2/(alpha+2) distinct
    oriented complete keys.
  - >-
    One good slice and one coupled source per attained key are enumerated in
    O(c^2) work and state by scanning the represented selected support.
  - >-
    Keys present on fewer than tau*c shifts carry at most
    sqrt(3*A*tau)*c^3 source occurrences when the global image has at most
    A*c^2 keys.
  - >-
    O(tau^-1*log c) random shift slices capture every high-shift-support key
    with inverse-polynomial failure probability and O(c^2*log c) work.
  - >-
    Restricting returned fifth sources to s=B^gamma shifts gives target
    density at most O(B^(gamma-1)); with gamma<=1/4 and direct online exponent
    5/4, the campaign exponent is at least 3/5.
