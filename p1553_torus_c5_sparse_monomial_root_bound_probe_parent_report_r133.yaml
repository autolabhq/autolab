verified_statements:
  - >-
    The proof of Kelley Theorem 2.3 adapts to a prime-order cyclic
    subgroup over F_(p^2), where the largest root coset has size one.
  - >-
    A nonzero represented extension-field sparse sum with at most four
    distinct subgroup modes cannot vanish on q^(3/4+o(1)) targets.
  - >-
    Under the explicit uniform-random-deck model, a pure-fifth witness
    subset and union bound exclude represented predicates through
    one quarter log2(q) modes with overwhelming probability.
  - >-
    All eight actual pairing controls replay every color's pure-fifth
    sources, but their small numerical union bounds receive no credit.
