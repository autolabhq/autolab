verified_statements:
  - >-
    Flattened factor-index residues give five target-independent colors,
    each represented by at most five A-residue by C-residue rectangles.
  - >-
    On all eight fixtures, a supplied first norm jet at a simple colored
    fiber recovers all five factor indices, all five A,C atom-index pairs,
    and the target group element exactly.
  - >-
    Empty-fiber controls have nonzero norm, all six fixtures with genuine
    multiple fibers have zero first jets, and a synthetic double-root control
    has zero norm and first derivative.
  - >-
    The standard colored source quotient and norm have B^5 dimension or
    degree; the R82 atom split exposes B^2 five-A support and B^3 five-C
    support before producing the constant-size jet.
  - >-
    All candidate-side semantic controls enumerate colored tuples and consume
    verifier BSGS labels, so they receive no relation, rank, or descent credit.
