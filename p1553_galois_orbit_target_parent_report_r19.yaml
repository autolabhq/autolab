verified_statements:
  - >-
    A geometrically Galois factor of degree e<p has a tame PGL2 deck group.
    Every unbounded such group is cyclic or dihedral; A4, S4, and A5 are
    bounded.
  - >-
    Factorization of the complete branch maps forces e to divide 2d and leaves
    bounded-degree outer maps when e=Theta(d).
  - >-
    J<=C*L/e implies orbit collision energy at least eL/C and puts at least
    half the fifth-list points in fibers with occupancy at least e/(2C).
  - >-
    A non-branch-preserving Mobius orbit graph lifts to a connected
    (Z/2)^2-cover of genus 5-s>=2, where s is the intersection size of the two
    four-point Kummer branch sets.
  - >-
    Only a bounded subgroup of PGL2 preserves the Kummer branch set, so a
    growing passing Galois factor needs Omega(eL) nonliftable genus-at-least-two
    fifth-list incidences.
  - >-
    A separable h:E->P1 of degree below N cannot semiconjugate translation by a
    nonzero N-torsion point to one single-valued rational self-map of P1. The
    quotient pullback would have to be both etale and branched.
