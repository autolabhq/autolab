terminal_verdict:
  classification: "scoped_negative_standard_net_aggregation"
  single_component_zero_semantics: "exact_on_the_nondegenerate_net_chart"
  fifth_label_gcd_support_gauge_invariant: true
  raw_interval_unit_values_gauge_invariant: false
  constructor_inside_online_cap: false
  unknown_aggregate_circuit_ruled_out: false
  statement: >-
    A shifted rank-two net term vanishes exactly on one generic scalar-orbit
    relation and its zero support survives quadratic net rescaling. Standard
    componentwise net recurrences are not closed under the diagonal product
    over Theta(B^4) pair-pair points. Their first nontrivial mixed seed either
    expands to B^4 target-dependent component states or, after granting R4's
    cheapest exact fixed-label resultant surrogate with the same zero support,
    costs B^(2+o(1)) online work and workspace. This exceeds the frozen
    B^(5/4+o(1)) cap before recurrence evaluation or dyadic replay.
  p1554_allocated: false
  contract_created: false
  run_created: false
  breakthrough_claim: false
  shoup_bound_claim: false

claim_boundary:
  closes:
    - "standard componentwise rank-two elliptic-net recurrence"
    - "standard division-polynomial supplied-term evaluation"
    - "Hadamard multiplication of component recurrences without mixed contractions"
    - "raw dyadic unit products claimed to be gauge invariant"
    - "target-fresh initialization by a standard fixed-label resultant inside B^(5/4)"
  does_not_close:
    - "an unknown list-specific arithmetic or Boolean circuit"
    - "an unknown target-local exact data structure"
    - "a proved aggregate recurrence with independently constructed compact mixed state"
    - "a coordinate-aware non-generic algorithm"
    - "the Shoup generic-group lower bound"
    - "ECDLP in general"

frozen_interface:
  group: "G=<P> of prime order N=p^(1+o(1)) on E(F_p), p>3"
  scale: "B=N^(1/5)"
  pair_decks:
    D12: "Theta(B^2) ordered signed source-labelled occurrences"
    D34: "Theta(B^2) ordered signed source-labelled occurrences"
  fifth_orbit: "a_j=A_0+[j]T for 0<=j<B"
  pair_setup: "B^(2+o(1)) work and retained words with dyadic ancestry"
  setup_cap: "B^(9/4+o(1))"
  online_cap: "B^(5/4+o(1)) total work and workspace including replay"
  target_freshness: "R occurs in no preprocessing coefficient, net seed, cache, orbit, or pointer."

net_zero_interface:
  pair_target: "q_(u,v)=A_0+u+v-R"
  shifted_second_point: "Q_(u,v)=q_(u,v)-2T"
  term: "W_(u,v)(j+2,1)=Psi_(j+2,1)(T,Q_(u,v))"
  reason_for_shift: >-
    For j>=0, (j+2,1) avoids the normalized exceptional vectors e_2 and
    e_1+e_2 whose net polynomials equal one.
  biconditional: >-
    On the nondegenerate chart,
    W_(u,v)(j+2,1)=0 iff [j]T+q_(u,v)=O iff u+v+a_j=R.
  factor_count: "Theta(B^4)"
  formal_aggregate: "F_R(j)=product_(u,v) W_(u,v)(j+2,1)"

gauge_and_charts:
  equivalence: "W'(z)=k*f(z)*W(z), with k and the quadratic f(z) nonzero"
  invariant:
    - "each component zero"
    - "the zero set of F_R"
    - "the gcd support after interpolation at fifth occurrence labels"
    - "the zero/nonzero status of an interval product"
  noninvariant:
    - "raw nonzero F_R values"
    - "raw dyadic interval unit products"
  nondegeneracy_missing:
    - "Q=O"
    - "Q=T"
    - "Q=-T"
    - "identity or infinity branches"
    - "tangent and vertical branches"
    - "repeated endpoints"
    - "nonreduced components"
  repair: >-
    Saturated projective masks or direct equality branches restore semantics.
    Their target-dependent incidence masks do not improve the standard cost.

mixed_seed_gate:
  normalization_not_enough: >-
    W(e_i)=W(e_i+e_j)=1 supplies only selected normalized terms. Every
    generating block contains nontrivial terms depending on Q_(u,v).
  componentwise:
    target_dependent_points: "Theta(B^4)"
    work: "B^(4+o(1))"
    state: "B^(4+o(1))"
  aggregate:
    raw_product_boundary: >-
      Raw net seed products can carry additional rational gauge units and are
      not assumed to equal the R4 key-difference resultant.
    strongest_grant: >-
      Replace the raw product by r_R(t_j), R4's exact fixed-label pair-divisor
      resultant with the same relation-zero support.
    one_seed_work: "B^(2+o(1))"
    one_seed_workspace: "B^(2+o(1))"
    obstruction: >-
      The seed is target-dependent and its zero decision is already fixed-label
      Query2P1, so it cannot be free preprocessing or supplied advice.

product_closure_gate:
  component_identity: "A_q+B_q+C_q=0"
  desired_state: "product_q A_q, product_q B_q, product_q C_q"
  result: >-
    Component identities do not imply that the three diagonal products sum to
    zero. Multiplying the identities creates every mixed choice in
    {A,B,C}^Q. No standard closed recurrence on only the diagonal products is
    obtained.
  preserved_exception: >-
    A new proved aggregate recurrence may exist, but it must construct its
    compact mixed state and update coefficients inside the cap.

restriction_replay:
  decision_value: "U_R(I)=product_(j in I) F_R(j)"
  exact_invariant: "U_R(I)=0 iff the interval contains an extendible fifth label"
  raw_value_boundary: "U_R(I) changes under independent component gauges"
  no_relation_control: >-
    Every component is a unit, so no early zero or dynamic split exists and all
    negative branches must be charged.
  source_output: >-
    O(log B) subset-stable bisection calls plus final complete-law singleton
    verification remain necessary.

