  - route: "two pair indexes"
    preprocessing: "B^2"
    online: "0"
    workspace: "B^2 retained"
  - route: "individual mixed net seeds"
    preprocessing: "B^2"
    online: "B^4"
    workspace: "B^4"
  - route: "one exact fixed-label resultant surrogate"
    preprocessing: "B^2"
    online: "B^2"
    workspace: "B^2"
  - route: "all B fixed-label resultants"
    preprocessing: "B^2"
    online: "B^3"
    workspace: "B^2"
  - route: "supplied aggregate recurrence after supplied seeds"
    preprocessing: "unaccounted advice"
    online: "B"
    workspace: "B"

conditional_complete_path:
  status: "unchanged_and_unproved"
  setup: "B^2"
  B_relation_targets: "B^(9/4), conditional on B^(5/4) total target queries"
  sparse_factor_log_algebra: "B^2"
  one_masked_descent: "B^(5/4)"
  lambda: "0.45"
  mu: "0.40"
  missing:
    - "the aggregate constructor"
    - "constant verified relation density"
    - "Theta(B) independent relation rank"
    - "factor-log completion"
    - "identical scalar-blind descent"
    - "complete bit accounting"

