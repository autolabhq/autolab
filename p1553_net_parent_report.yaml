controls:
  - "one generic relation hit on the nondegenerate chart"
  - "one no-relation all-unit target"
  - "independent nonzero quadratic rescaling of every component net"
  - "identity, +/-T, tangent, vertical, infinity, repeated, and nonreduced strata"
  - "replace R only after preprocessing"

exactly_one_next_action: >-
  Rerank outside standard elliptic-net, division-polynomial, EDS, QRT/Lax, and
  supplied-recurrence families. Under existing P1553/P1513/P1551/P1516
  ownership, admit only one theorem-only mechanism-distinct compiler that
  constructs both the target-fresh mixed aggregate state and its
  restriction-stable zero decoder inside total B^(5/4+o(1)), with complete
  charts and replay; otherwise preserve the specialized Query2P1 exception.

