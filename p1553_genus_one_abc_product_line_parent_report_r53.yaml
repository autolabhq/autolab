theorems:
  - >-
    Removing the common zero divisor makes the residual zero divisors of three
    dependent sections pairwise disjoint and identifies them with the zero,
    one, and pole fibers of a degree-m map.
  - >-
    A separable degree-m map from a genus-g curve satisfies m <= n + 2g - 2,
    where n is the number of distinct points over zero, one, and infinity.
  - >-
    On genus one, this single three-fiber inequality excludes only total
    residual radical n < m and does not see a partition of reduced zeros into
    low-degree factors.
