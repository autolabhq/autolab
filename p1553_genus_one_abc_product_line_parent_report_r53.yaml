summary: >-
  After cancelling the common divisor from three dependent elliptic sections,
  separable Riemann-Hurwitz gives m <= n, where m is moving map degree and n
  is total radical support in the zero, one, and pole fibers. R52 satisfies
  3 <= 9 with slack six, while a hypothetical primitive reduced degree-nine
  split pencil satisfies 9 <= 27 with slack eighteen. This single three-fiber
  inequality is blind to factor ownership and cannot by itself supply a
  one-varying-factor theorem.
