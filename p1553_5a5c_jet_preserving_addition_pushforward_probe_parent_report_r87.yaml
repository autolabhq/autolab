verified_statements:
  - >-
    Exact Pontryagin norm composition requires P_C and P_C' at every shifted
    target T-a, not only the first norm jet at the final target T.
  - >-
    Two split cubics with valid five-marker root perturbations have identical
    seven-scalar local first jets over F_101, but composition with the same
    two-point left divisor gives different scalar first jets.
  - >-
    In characteristic p>n, translations of a monic degree-n polynomial span
    every polynomial of degree at most n; modulo degree-m A with m<=n+1, the
    translated remainder orbit has full dimension m.
  - >-
    Four finite controls attain full remainder ranks 3,5,7,9, and a
    32-by-243 synthetic endpoint split recovers one unique ten-choice source
    by a degree-one translated gcd.
  - >-
    The five-A characteristic polynomial has B^2 degree, the five-C
    polynomial has B^3 degree, and an explicit fresh translated remainder has
    B^2 words, outside the stated setup/query rectangle.
