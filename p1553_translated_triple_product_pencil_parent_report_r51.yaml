summary: >-
  Tiling the 81-point path by nine translated copies of the R38 three-fiber
  pattern yields 253 admissible degree-nine blocks formed by unions of three
  local triple fibers with window-index sum 12. Exact Plucker scanning of all
  31,878 section pairs gives 31,194 pencil lines containing two blocks and 228
  lines containing three. The maximum is three, below nine required for an
  exact 81-point cover. A canonical combinatorial exact cover exists but its
  nine section vectors have rank nine. The three-block lines remain to be
  classified for shared divisor factors.
