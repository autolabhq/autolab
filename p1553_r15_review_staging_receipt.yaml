draft_research_result:
  status: review_required_scoped_negative
  exact_correlation_boundary: >-
    Complete branch trace and norm moments reduce to weighted correlations on
    h(A), h(A+Q), and h(A-Q). The exact Fourier expression has two character
    variables. When one branch exponent is zero it collapses to the admitted
    one-frequency positive control.
  source_boundary: >-
    The raw map (A,Q) to (A+Q,A-Q) is invertible in an odd-order group, so
    retaining both raw translates restores exactly S*L source pairs. Applying
    h can merge them, but sparse sumset enumeration alone does not provide one
    joint source after the merge.
  sparse_convolution_boundary: >-
    Named output-sensitive sparse nonnegative convolution algorithms use
    explicit integer indices and cancellation-free coefficients. The EC
    moment problem has unknown scalar indices and field-valued cancellation;
    image size is not ordinary convolution support size.
  r10_boundary: >-
    R10 asks for B shifted coefficients of a nonnegative multiplicative
    convolution whose full support may contain B^4 values. Full-support
    output-sensitive computation is therefore not the required query
    interface.
  surviving_exception: >-
    A query-sensitive list-restricted nonhomomorphic translation-correlation
    sketch, or a family-specific common-component identity, may still emit the
    R14 moment, containment, joint-source, child, target, and R10 package
    without scalar logs, N character modes, S*L translate pairs, or full
    convolution support. It remains unconstructed and not excluded.
