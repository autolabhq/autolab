verified_statements:
  - >-
    The degree-five cycle-index identity has seven terms with coefficients
    summing to 120 and reproduces every canonical side divisor exactly.
  - >-
    The positive 49-term two-deck identity reproduces every all-target count
    on eight actual and eight matched-random decks after division by 14400.
  - >-
    Every canonical side source has cycle weight 120 and every full source
    has cycle weight 14400 while preserving all ten R105 marker coordinates.
  - >-
    The coefficient-one identity-cycle term retains a B^5 source body and
    B^(13/5) root interface.
  - >-
    The theorem of the cube gives pair-table exponents at most B^(6/5), but
    no target-section tensor factorization is supplied.
