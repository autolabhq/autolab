verified_statements:
  - >-
    Because S_6 is fixed, substituting five univariate coordinate maps gives a
    coefficient tensor over F_p with constant CP rank and B^(1+o(1)) factor
    storage, including after univariate reduction modulo the label-domain
    polynomials.
  - >-
    Weighted inner products of two supplied bounded-rank CP tensors factor
    into one-dimensional inner products. An exact Gram matrix for a supplied
    cap-sized shift family can therefore be computed without materializing the
    B^5 ambient coefficient vector.
  - >-
    Literal-power generators g_(k,alpha)=p^(m-k) z^alpha tilde(F_R)^k retain
    p^m divisibility at every root and have CP rank at most
    binomial(r+k-1,k). Integer reduction modulo the domain polynomials
    preserves label values and separation.
  - >-
    Gram-form LLL returns integer combinations whose represented CP rank is at
    most the total input rank A. In the naive pairwise implementation, setup
    and online costs are B^(2+o(1))*A^2 and B^(1+o(1))*A^2, so both caps
    require A<=B^(1/8+o(1)).
  - >-
    This implicit Gram observation corrects any inference that B^5 ambient
    dimension alone is a runtime lower bound. Generator count, integer height,
    tensor-rank growth, lattice reduction, and root recovery must be charged.
  - >-
    A modular CP decomposition does not bound the rank of the centered integer
    carry tensor K_k in ctr_(p^k)(tilde(F_R)^k)=tilde(F_R)^k-p^k*K_k.
    Such a low-rank carry is sufficient for compact recentering but is not
    formally necessary because the uncentered separated lift is valid.
  - >-
    On generic full-degree interpolation maps, the natural separated integer
    lift has a nonzero coefficient at root-scaled degree Omega(B), hence norm
    at least B^(Omega(B)); multiplying by p^(m-1) does not make that vector
    Howgrave-Graham-short relative to p^m.
  - >-
    Standard monomial p^k-shifts supply arbitrary entrywise cancellations in
    the integer domain quotient, whose rank is Theta(B^5). No smaller
    structured cancellation module with a determinant theorem is constructed.
  - >-
    Although LLL output rank is bounded by A in the retained-combination
    representation, no admitted input module returns five useful short integer
    polynomials or exact restricted decision-and-source recovery.
