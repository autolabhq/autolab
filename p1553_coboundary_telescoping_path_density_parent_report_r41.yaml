summary: >-
  A consecutive product of the R40 coboundary locator telescopes exactly to
  two h endpoint values. On the exact toy, however, the raw length-nine
  product has 17 hit targets, 16 zero-pole overlaps, and only nine positive
  reduced orders; eight genuine hits are erased. Even granting pole separation
  and unit endpoint evaluation, K explicit path quotients cover at most
  K*L+|V|-K targets and cost Omega(K), giving expected Omega(N/L)=Omega(B^3)
  work per scalar-blind hit at L=B^2. Only one global cancellation-free marked
  across-path locator remains open.
