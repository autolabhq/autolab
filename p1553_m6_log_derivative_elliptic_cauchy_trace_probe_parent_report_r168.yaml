verified_statements:
  - >-
    The invariant logarithmic differential dg/g has residue equal to the zero
    multiplicity and preserves every candidate because N is below p.
  - >-
    Differentiating the R167 identity replaces the multiplicative resultant by
    a corrected additive trace of Dh/h over S union -S.
  - >-
    Six controls contain 241 direct and swapped simple zero occurrences at 140
    candidate roots, with maximum multiplicity four and no residue cancellation.
  - >-
    All six public P=T rational poles have nonzero residue -2n and are exactly
    removed by the signed U,V equality prefilter and semantic factor-one rule.
  - >-
    Compact h and Dh/h state costs B^(5/4), while direct, raw swapped, and tensor
    routes cost B^(7/2), B^(9/2), and B^(9/2), respectively.
