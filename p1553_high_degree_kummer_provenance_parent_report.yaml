frozen_interface:
  group_order: N=p^(1+o(1))
  label_bound: B=N^(1/5)
  pair_occurrences: B^2
  pair_endpoint_support: S distinct Kummer classes
  pair_endpoint_multiplicity: kappa=max pair occurrences in one endpoint class; S>=B^2/kappa
  fifth_occurrences: B distinct Kummer classes with occurrence labels
  map: nonconstant psi:P1->P1 of degree d; f=psi composed with x has degree 2d
  branch_state: complete projective divisor D_(u,q)=[f(A+Q)]+[f(A-Q)]
  setup_and_state_cap: B^(9/4+o(1))
  online_and_workspace_cap: B^(5/4+o(1))
  output: exact restricted miss or one completely verified signed occurrence-labelled source
verified_statements:
  - >-
    For a fixed fifth label q, endpoint psi label, and complete branch divisor
    D, at most d Kummer endpoint classes u share the indexed key
    (q,psi(u),D). Hence the number of nonempty indexed headers is at least
    S*B/d.
  - >-
    If S=Theta(B^2), fitting indexed headers beneath B^(9/4+o(1)) requires
    d=Omega(B^(3/4-o(1))). This is a header floor, not a lower bound for every
    implicit image constructor.
  - >-
    After erasing q, a complete divisor fiber contains at most 8d^2 signed
    (A,Q) pairs and no more Kummer-class pairs. Thus divisor-only headers
    number at least S*B/(8d^2).
  - >-
    Explicit all-preimage provenance contains S*B incidences. A full S*B
    construction pass may instead retain one witness and an exact count per
    header, so S*B is then setup work rather than persistent provenance. At
    dense support both direct routes expose a B^3 charge, but no theorem here
    excludes an oracle-free implicit algebraic image and inversion algorithm.
  - >-
    R11's independent selective-collision argument still forces
    d=Omega(B^(1/2)) before a positive fraction of dense branch incidences can
    be genuinely compressed.
  - >-
    Every separable degree-d isogeny with d<N is injective on the prime-order
    subgroup G and on its Kummer classes. Thus ECFFT and quotient-isogeny maps
    through degree O(B) give exact branching but no target-subgroup compression.
  - >-
    An auxiliary composite-torsion quotient control with d=B^(3/4) compresses
    Theta(B^2) Kummer pair endpoints to Theta(B^(5/4)) labels and yields
    Theta(B^(9/4)) indexed label/fifth states with exact branch composition.
    Its source index has Theta(B^2) endpoint entries, Theta(B^(5/4)) quotient
    representatives, and Theta(B^(3/4)) kernel data. Exact source recovery
    enumerates and verifies d kernel-coset candidates within the online cap.
    It fails the prime-order gate because its kernel intersects the source
    subgroup nontrivially.
  - >-
    A degree-O(B) polynomial can collapse every endpoint and branch coordinate
    on a known-multiple arithmetic-progression grid. Its fivefold endpoint
    support is O(B), so uniform relation density is O(B/N) and B rows require
    Omega(N) targets even under favorable rank assumptions.
