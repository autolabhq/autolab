exactly_one_next_action: >-
  Derive or refute one oracle-free implicit algebraic image-and-inversion
  algorithm for the fifth-label-erased complete divisor map on a frozen dense
  pair support with d from B^(1/2) through O(B). It must avoid enumerating S*B
  incidences, express the R10 rank-two control, meet B^(9/4) setup/state and
  B^(5/4) fresh-target work/workspace for every adaptive child, invert one
  accepted state to exact occurrence labels, and charge density, independent
  rank, factor logs, and identical blind descent. A negative closes only this
  frozen grammar; a positive remains model-bound until the complete ECDLP path
  is proved.
