verified_statements:
  - The target-sign conjugate product removes target-y dependence through an exact Semaev S3 identity.
  - Six controls verify 2,972 homogenized translation factors and 1,486 target-sign conjugate S3 products.
  - Six iterated-resultant controls verify 8,922 factor-product rows and one exact denominator batch modulo each selected divisor U.
  - The plus branch exactly replays all 140 R171 candidate roots; the conjugate branch adds one finite-control root, with signed verification retained.
  - The six represented reverse resultants fill all 1,270 coefficient slots and have full coefficient-matrix rank sum 86.
  - The represented reverse-resultant body costs B^(5/2), exactly the rho proxy before the final self-resultant; the standard local route costs B^(7/2).
  - A softly linear factored self-S3 resultant modulo arbitrary squarefree U is not supplied by the producer or the audited literature contracts.
