  - >-
    Under injectivity of the feasible signed C6 coefficient map, an unordered
    endpoint is singleton exactly when its coefficient vector has l1 norm six.
  - >-
    All 24 actual curve controls satisfy coefficient-map injectivity, the
    cancellation-pair fiber formula, and the singleton criterion.
  - >-
    Public curve-point equality supplies every signed relation row and known-A
    right-hand side without verifier scalar labels or a DLP oracle.
  - >-
    Twenty-three controls have full rank and recover all C factor logs; all
    recovered logs verify by public scalar multiplication.
  - >-
    The lone failure has two projective rows for dimension three, and no
    control has residual dependency after projective row count is sufficient.
  - >-
    Explicit C6 endpoint enumeration costs B^(9/2), exceeds rho, and receives
    no attack or asymptotic credit.
