verified_statements:
  - >-
    All four field primes and subgroup orders are prime, every curve order
    replays as the stated prime subgroup times cofactor, and every curve
    discriminant is nonzero.
  - >-
    Three public legal x-class decks per curve are derived from
    domain-separated SHA-256 x-coordinate streams followed by canonical
    square-root selection and public cofactor clearing; no scalar label or
    discrete logarithm is consumed.
  - >-
    For all 4096 full-grid target tuples, the closed quadratic-resultant
    formula equals the exact Bareiss determinant of the Sylvester matrix.
  - >-
    S4 vanishes modulo p exactly when one of the eight normalized signed group
    relations exists. There are zero predicate mismatches, and every forced
    positive witness verifies.
  - >-
    Every centered carry division is exact. Every rank-one constant control
    has mode rank one under both auxiliary primes.
  - >-
    For every curve, target, prefix size, and mode, both the centered
    remainder and centered carry flattenings have full row rank B under both
    auxiliary primes. Thus every frozen carry has rational matrix rank and
    rational CP rank at least B.
  - >-
    At B=8 every raw integer S4 lift has mode rank five under both auxiliary
    primes. Fixed-target S4 has degree four in each variable, which gives a
    matching rational upper bound and proves exact raw mode rank five.
  - >-
    The full-rank carry result rejects only the canonical k=1 S4 lift on the
    named legal grids. It is not an asymptotic rank theorem for S6, a runtime
    lower bound, or a rejection of noncanonical and non-CP interfaces.
