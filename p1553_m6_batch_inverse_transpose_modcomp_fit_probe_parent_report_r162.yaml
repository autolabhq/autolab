verified_statements:
  - >-
    Q_u=(U(u)-U(X))/(u-X) gives the exact quotient identity and, when U(u)
    is nonzero, (u-X)^(-1)=Q_u/U(u) modulo U.
  - >-
    Batch multipoint evaluation of U at all target x-coordinates detects
    exactly the denominator-exception roots.
  - >-
    Any fixed coefficient functional of every Q_u transposes to evaluation
    of one cross-correlation polynomial P_w at all target coordinates.
  - >-
    The published quasi-linear precomputation result fixes both modulus and
    inner map before varying the outer input, so it does not share across
    R162's target-varying inner maps as stated.
  - >-
    Independent near-linear modular composition over all targets costs
    B^(7/2+o(1)); one aggregate soft-linear-n pass costs B^(9/4+o(1)), misses
    the strict phase cap, but remains below rho's B^(5/2).
  - >-
    Six finite controls verify batch evaluations, exceptional detection,
    quotient/inverse identities, and transposed functionals without candidate
    oracles.
