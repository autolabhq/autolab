summary: >-
  For every fixed separable degree-d rational Kummer map and fixed endpoint
  deck, the exact complete-key collision energy over a uniformly sampled
  L-element fifth deck is a sum of pairwise branch-correspondence incidences.
  Each correspondence has degree O(d) in one fifth coordinate. In the P1553
  S=B^2, L=B, N=B^5, d<=B rectangle, the expected number of nontrivial
  ordered collisions is O(B), so the expected complete image has
  B^3-O(B) states and exceeds the B^(9/4) cap. Adaptive or adversarial support
  co-design remains open.
