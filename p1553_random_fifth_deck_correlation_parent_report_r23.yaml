theorems:
  - >-
    Distinct Kummer endpoint classes cannot induce identical complete branch
    maps when deg(psi composed with x)=2d<N, because equality would force
    invariance under a nonzero order-N translation.
  - >-
    The pairwise branch relation R_(u,v) has at most M*Delta points on the
    prime-subgroup Kummer square, and its same-fifth diagonal has at most
    2*Delta points for distinct endpoint classes.
  - >-
    For exact complete-key multiplicities m_y, the ordered nontrivial
    collision correlation is C_Q=sum_y m_y(m_y-1), the energy is n+C_Q,
    n-K_Q<=C_Q, and K_Q>=n^2/(n+C_Q).
  - >-
    Any image of size O(n/d) requires C_Q=Omega(n*d) exact complete-chart
    incidences.
  - >-
    Sampling an L-subset without replacement after psi and U are fixed gives
    E[C_Q]=O(S*d^2*L^2/M+S*d^2*L/M)=O(B).
  - >-
    Consequently E[K_Q]>=B^3-O(B), and the probability of even a fixed
    constant compression is O(B^-2).
