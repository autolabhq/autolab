verified_statements:
  - >-
    On a singleton canonical A-multiset/C-multiset target fiber, dividing
    each exact aggregate atom marginal by the exact ordered fiber count
    recovers every atom multiplicity over the integers.
  - >-
    The independently enumerated canonical source quotient has exactly the
    same positive target support as R144 on all eight controls, and all
    sampled R144 ordered counts and marginals replay.
  - >-
    Singleton canonical sources constitute between 98.181818 percent and
    100 percent of positive fibers in the eight finite controls, with
    maximum canonical occupancy at most three.
  - >-
    In the independent-uniform dense m=6 model, canonical target occupancy
    tends to Poisson lambda with lambda=1/(6!)^2, so the conditional
    singleton probability tends to 0.9999990355000988.
  - >-
    For any source-to-target map, mean positive occupancy M/H and uniform
    hit density H/q are reciprocal at fixed M/q; superconstant aggregate
    occupancy receives no free retry credit.
