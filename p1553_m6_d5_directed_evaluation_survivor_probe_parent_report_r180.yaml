verified_statements:
  - All six target-factor products recover the exact R174 and R178 candidate factor.
  - The individual target-factor zero unions equal the candidate-root sets.
  - Exact dynamic programming finds the optimal early-split order in every finite control.
  - Every optimal order respects the noncandidate survivor lower bound (n-c)N.
  - Every recorded split occurs at an actual nonunit and every final survivor factor is a unit.
  - Directed evaluation removes repeated splitting overhead but preserves the N-step tree cost.
  - The standard D5 half-GCD and cited generic algebraic modular-composition routes remain above rho.
