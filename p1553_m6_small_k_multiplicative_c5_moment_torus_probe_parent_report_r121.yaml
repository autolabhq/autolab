verified_statements:
  - >-
    On every R82 pairing control, the odd-q image lies in the norm-one torus
    and avoids the unique omitted Cayley-chart point -1.
  - >-
    The Cayley parameter t=b/(a+1) roundtrips every deck image, converts
    multiplication to (t+s)/(1+d*t*s), and converts each five-product query
    to the exact degree-five symmetric equation B-t_target*A=0.
  - >-
    Every canonical five-product moment equals the complete homogeneous
    polynomial h_5 in the powered deck; the first twice-support moments match
    direct enumeration on all eight controls.
  - >-
    Berlekamp-Massey has order exactly equal to the injective C5 support and
    returns the full endpoint annihilator; every positive product is a root
    and every inherited empty target is rejected.
  - >-
    The C2|C3 split uses B^(9/4) setup and B^(3/2) query, returns exact five
    projective occurrence backpointers, and rejects the empty controls.
  - >-
    Full moment and annihilator state has exponent B^(15/4); the direct k=6
    indexing theorem has B^(33/8) state, and the general subfunction theorem
    is either outside its output-universe hypothesis or retains B^(15/4)
    state under the explicit injective-image grant.
