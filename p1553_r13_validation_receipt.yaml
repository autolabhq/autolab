research_result:
  status: revise_scoped_theorem
  exact_new_boundary: >-
    For S endpoint classes and L distinct fifth Kummer classes, fixed-endpoint
    branch energy gives
    K>=S^2*L^2/[d*(S*L+32d*binomial(L,2))]. At certified dense support,
    L=Theta(B), and d<=B, this is K=Omega(B^3/d), so any explicit O(K)
    erased-image representation below B^(9/4) requires
    d=Omega(B^(3/4-o(1))).
  representation_construction_split: >-
    The squarefree image, exact geometric and occurrence multiplicities,
    complete keys, and one jointly coupled pair/fifth source have O(K)
    representation when supplied. Standard graph-first norm,
    characteristic-polynomial, multiplication-matrix, graph-resolution, and
    pushforward or Fitting routes expose n=S*L=Theta(B^3) at dense support.
  completeness_and_replay_split: >-
    Root witnesses and total mass do not certify that no image state was
    omitted. One global source section does not determine adaptive child
    counts when another source in the same fiber lies in the child.
  preserved_retraction: >-
    No O(d^2) bound is claimed for all cross-endpoint, cross-fifth collision
    pairs; common components of that fiber product remain unclassified.
  surviving_exception: >-
    A family-specific output-sensitive radical-image compiler in the dense
    B^(3/4-o(1))<=d<=B range, with exact weights, a jointly coupled source,
    compressed containment, every adaptive child, fresh-target action, and
    R10 rank-two replay, remains unconstructed and not excluded.
