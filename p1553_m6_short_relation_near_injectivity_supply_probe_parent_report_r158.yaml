verified_statements:
  - >-
    Global injectivity of the feasible C6 coefficient map is asymptotically
    false because its expected collision-pair count is B^4.
  - >-
    The expected bad singleton fraction is O(B^(-1/2)); a B^(-1/4) bad
    fraction threshold fails with probability O(B^(-1/4)).
  - >-
    The complete singleton relation-row universe is exactly the integer
    vectors with l1 norm five or seven and has size Theta(B^(21/4)).
  - >-
    Collision pruning removes only an o(1) row fraction in the iid cyclic
    model.
  - >-
    Canonical combined A/C forms are pairwise nonproportional and their zero
    events are pairwise independent.
  - >-
    O(log B) independent A batches supply Theta(B^(3/4)log B) distinct rows
    with vanishing relative failure and vanishing duplicate-row probability.
  - >-
    Pairwise independence proves only a vanishing uncovered fraction, not
    zero uncovered columns or full rank.
  - >-
    All 36 collision-pruned finite controls cover all columns and have full
    rank, but explicit enumeration remains B^(9/2) and receives no attack
    credit.
