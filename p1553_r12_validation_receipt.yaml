research_result:
  status: revise_scoped_theorem
  exact_new_boundary: >-
    A fifth-label-indexed psi-respecting branch table on certified dense pair
    support needs at least S*B/d headers, so the B^(9/4) state cap forces
    d=Omega(B^(3/4-o(1))). Erasing the fifth label enlarges a complete-key
    fiber to at most 8d^2 and leaves an implicit image-and-inversion route.
  construction_state_split: >-
    Storing all preimages costs S*B state; a direct count-plus-one-witness pass
    may use less persistent state but still costs S*B construction work. At
    dense support both direct routes expose a B^3 charge.
  standard_construction_closure: >-
    Every separable isogeny of degree d<N, including the ECFFT quotient
    mechanism through O(B), is injective on the prime-order subgroup and its
    Kummer classes. It gives exact branch composition but no compression.
  surviving_exception: >-
    A list-specific non-isogeny implicit algebraic constructor for the erased
    complete branch image, with exact source inversion and the R10 rank-two
    control, remains unconstructed and not excluded.
