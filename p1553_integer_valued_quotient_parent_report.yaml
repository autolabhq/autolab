verified_statements:
  - >-
    The falling-factorial and monomial transforms are integral
    unitriangular. The binomial evaluation matrix on consecutive labels is
    lower unitriangular, and all factorial denominators are units modulo p^m
    because every deck size is below p.
  - >-
    An integer-valued Newton formulation can avoid clearing all factorial
    denominators, so ordinary monomial coefficient height alone is not an
    invariant obstruction. Clearing back into Z[z] restores the factorial
    scale and must be charged.
  - >-
    Tensor-product Newton and CRT transforms are invertible factorwise and
    preserve supplied CP rank. They diagonalize the finite-grid quotient but
    retain its product_i(s_i)=Theta(B^5) abstract rank.
  - >-
    In the split F_p quotient, an empty root fiber is exactly the statement
    that F_R is a unit. An exact miss certificate is an inverse, while exact
    positive support is 1-F_R^(p-1); singleton source multipliers already
    encode the unknown source.
  - >-
    The inverse and singleton multipliers are branch certificates, not a
    uniform multi-root constructor. The exact uniform identities use
    G_R=F_R^(p-2) and chi_R=1-F_R^(p-1), and an implementation must decide
    chi_R=0 versus chi_R!=0 while preserving a positive restricted child.
  - >-
    LLL failure is not an exact miss certificate, and short quotient vectors
    need not isolate the source fiber. Exact decision, useful shortness, and
    source recovery remain separate gates.
  - >-
    Shi's rank formula implies that for B below (p+1)/2 there is a B by B
    least-residue multiplication minor with real rank B although its reduction
    modulo p has rank one. Its integer carry relative to the raw outer product
    has rank at least B-1.
  - >-
    Tensoring that minor with three all-ones modes gives an exact five-mode
    control against inferring a low-rank canonical bounded lift or carry from
    modular CP rank. Its rational CP rank is B. Factorwise invertible rational
    basis transforms before recentering preserve its two-block flattening
    rank, but CRT recentering is nonlinear and is not covered.
  - >-
    The control is not a rank theorem for actual S_6 deck tensors and does not
    rule out other bounded lifts, elliptic-specific cancellations, shared
    correlations, or non-CP implicit modules.
  - >-
    The first standard over-budget target-fresh objects are the p^k-centered
    remainder or carry and the exact quotient inverse/projector. Explicit CRT
    realization has B^5 coordinates; no cap-sized separated constructor is
    supplied.
