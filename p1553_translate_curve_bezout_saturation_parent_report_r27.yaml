summary: >-
  After R26, every nonzero shift gives an integral bidegree-(c,c) translate
  curve with genus-one normalization. One curve has total delta defect
  (c-1)^2-1; two distinct curves intersect with multiplicity 2c^2; and equal
  curves arise from at most six g-preserving automorphisms per shift. These
  bounds give a complete-image floor Omega(B^2). Achieving O(B^2) requires
  Bezout saturation across Omega(B^2) shift pairs and then one of two exact
  branches: Omega(B^3) selected singularity defect, or a multiplicity-stripped
  value grid with Omega(B) distinct shifts on positive incidence mass.
