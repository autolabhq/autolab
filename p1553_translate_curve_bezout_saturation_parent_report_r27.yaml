theorems:
  - >-
    An integral bidegree-(c,c) translate curve with genus-one normalization
    has total delta invariant (c-1)^2-1 and at most twice that many ordered
    distinct normalization collisions.
  - >-
    Two distinct translate curves have intersection number 2c^2, which bounds
    their ordered normalization source matches.
  - >-
    Curves equal only through an automorphism preserving g; trivial
    translation stabilizer bounds these automorphisms by six per shift.
  - >-
    Complete-key energy is at most
    4L^2c^2+12L(z+2c^2), giving K=Omega(B^2).
  - >-
    An O(B^2) image with z=Theta(cr) forces Omega(c^2) selected intersection
    multiplicity on a positive fraction of shift and branch-matching pairs.
  - >-
    Writing D for selected same-curve normalization collision defect, the
    saturation dichotomy is D=Omega(Lc^2), or the multiplicity-stripped
    distinct-shift grid has squared incidence sum Omega(L^2c^2).
  - >-
    In the second branch, Omega(c^2) value pairs carry Omega(L) distinct
    shifts on positive incidence mass.
