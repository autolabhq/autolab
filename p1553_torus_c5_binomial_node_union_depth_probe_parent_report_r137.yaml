verified_statements:
  - >-
    Cauchy-Davenport gives at least 5m-4 fivefold products from every
    m-atom subset of the prime-order pairing image.
  - >-
    Every nonzero represented binomial has at most one root in the
    prime-order pairing image.
  - >-
    Every exact structured binomial zero-test tree has all-nonzero path
    depth at least 5m-4=B^(3/4+o(1)), regardless of product expansion.
  - >-
    Under the frozen uniform-random support model, trees with at most
    four modes per node have polynomial all-nonzero path depth.
  - >-
    Thirty finite color controls attain the Cauchy-Davenport bound and
    replay a positive and inverse empty on the same binomial path.
