verified_statements:
  - >-
    For mF=mA+mC, a stored C_s table and enumerated C_r complement with
    s+r=m-1 has charged relation-collection exponent
    L=delta+m*alpha+(r+2)*beta.
  - >-
    The density identity and setup condition imply
    L>=5+beta-s*beta>=11/4+beta>5/2 for every fixed arity and beta>0.
  - >-
    At m=6, alpha=1/12, beta=3/4, s=3, r=2, the exact R121 split costs
    B^(11/4) fresh work and B^(7/2) relation collection after meaningful
    rank is charged.
  - >-
    Exhaustive q=11 controls verify exact 1/q collision probability for
    distinct canonical source vectors of arities one through four.
  - >-
    Under the iid random-deck model, every setup-eligible C_s endpoint
    support remains at occurrence scale with high probability because
    s*beta<=9/4<5.
  - >-
    A denominator-48 audit covers 253,368 rational regimes at arities 3
    through 20; all 97,453 setup-eligible rows satisfy the theorem.
