verified_statements:
  - >-
    A singleton C6 endpoint source normalizes to a signed quotient row of
    width at most seven after public multiplicity division.
  - >-
    All 48 controls replay singleton normalization exactly, and singleton
    matrices explain exactly the same eleven full-rank outcomes as the
    aggregate R154 matrices.
  - >-
    Seventeen controls cover every signed column but remain rank deficient;
    every row set is closed under opposite rows and exhibits projective row
    reuse.
  - >-
    An independent fixed-width sparse-support comparator needs n log n total
    incidences for all-column coverage with high probability; the logarithmic
    factor changes no campaign B exponent.
  - >-
    The two pinned sparse-rank theorems require independent supports or a
    prescribed-degree random Tanner graph, neither of which is established
    for shared-deck convolution rows.
