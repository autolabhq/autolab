theorems:
  - >-
    Equal Abel sums place the nine degree-nine block divisors in one complete
    linear system, but one common pencil additionally requires their nine
    section vectors to have rank exactly two.
  - >-
    Every affine embedding of the normal magic-square row partition has rank
    nine, while every affine embedding of its column partition has rank eight
    or nine.
  - >-
    Every exact rank instance in the finite equal-pair-sum trade walk has rank
    eight or nine and therefore is not a primitive degree-nine pencil.
