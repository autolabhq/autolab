summary: >-
  A primitive degree-nine pencil partitioning an 81-point interval into nine
  fibers needs equal Abel sums and rank two among the nine exact section
  vectors in H^0(E,O(9O)). Exhausting all 10,506 affine contexts of the normal
  order-nine magic-square row and column partitions gives rank nine for every
  row instance and ranks eight or nine for every column instance. A
  deterministic 20,000-step equal-pair-sum trade walk contributes 160,008
  exact rank instances in eight affine contexts and also has minimum rank
  eight. The tested structured families contain no pencil; arbitrary
  primitive degree-nine pencils remain open.
