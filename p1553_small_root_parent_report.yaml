verified_statements:
  - >-
    The three favorable occurrence indices have ranges Theta(B^2),
    Theta(B^2), and Theta(B), so their natural source box has volume
    Theta(B^5)=Theta(N).
  - >-
    Replacing pair endpoints by pair-occurrence indices does not create cheap
    polynomial access: an arbitrary pair-deck coordinate map is a supplied
    lookup table or a dense interpolation polynomial of degree Theta(B^2).
  - >-
    A dense selector or one-hot endpoint channel costs B^(2+o(1)) per fresh
    target before small-root lattice work, above the B^(5/4+o(1)) online cap.
  - >-
    Keeping complete affine addition variables retains full-field coordinates,
    modulus-size carry branches, or both. Eliminating them returns the standard
    complete addition/Semaev and resultant controls.
  - >-
    The existing IDEA-049 complete-slope argument rejects the natural global
    centered affine lift; it is not an impossibility theorem for every special
    deck or nonlinear transducer.
  - >-
    A stronger five-label correction is explicit: degree-<s_i Lagrange maps
    send each restricted x-class label to its public x-coordinate, and the
    fixed S_6 circuit evaluates the target predicate in B^(1+o(1)) work
    without a pair selector. Public domain polynomials D_i bind legal node
    labels, and the degree of F_R in label z_i is at most 16(s_i-1).
  - >-
    On nonidentity x-class decks with sign-closed restrictions, an S_6 zero is
    exactly a signed relation. Constant-many sign recovery, global target-sign
    normalization, and complete projective verification return an exact
    signed source from one root; a zero target is a separate direct branch.
  - >-
    Each x-class stores a canonical representative, global factor-base column,
    and occurrence backpointers. Repeated classes across colours aggregate
    signed coefficients in one global column and receive rank credit only for
    the resulting row.
  - >-
    The same signed source inverse gives r+sum_C c_C*log(P_C)=0 for known-log
    targets and x=-t-sum_C c_C*log(P_C) for blind R=Q+[t]P. Known-log
    collection resamples R=O; a blind zero target directly yields x=-t.
  - >-
    Canonical dyadic restrictions admit precomputed local label-coordinate maps
    with B^(1+o(1)) total coefficient state per deck tree and B^(1+o(1))
    map-selection and candidate-evaluation work across logarithmically many
    replay levels. Root, exact-miss, output, and negative-child costs remain
    unsupplied.
  - >-
    The five-label root box still has volume B^5=N. At full nodes, a standard
    rectangular or dense total-degree monomial embedding has Theta(B^5)
    positions in its first coefficient vector, before lattice reduction. No
    tensorized determinant inequality or complete root/source locator is
    constructed from the separated circuit inside the online cap.
