verified_statements:
  - >-
    The deterministic function U(x(Q)) has pole order 2n and zero divisor
    S+(-S), so every x-only candidate is a true or opposite-sign orientation.
  - >-
    For planted positive targets, every false-sign form v-p+q has coefficient
    sum six and is nonzero; under iid cyclic labels its expected pair count is
    at most n^2K/q=B^(1/4+o(1)).
  - >-
    Independent uniform unplanted targets contribute at most
    n^2N/q=B^(3/4+o(1)) expected opposite-sign pairs; exact signed verification
    costs B^2 in expectation.
  - >-
    Six inherited batches have 241 true pairs and zero opposite-sign pairs;
    six matched-density controls have 100 true and 89 opposite-sign pairs.
  - >-
    A forced T=P-Q control produces six opposite-sign candidates and no true
    candidates; signed verification returns the empty union.
  - >-
    The explicit arbitrary-target Kummer translate product has zero and pole
    divisor degrees 2nN=B^(7/2), above rho; no output-sensitive remainder
    constructor is supplied.
