verified_statements:
  - >-
    With H=B^gamma balanced buckets, one represented C2-C3 bucket
    resultant has optimistic work B^(9/4-gamma).
  - >-
    Querying all H^2 bucket pairs costs B^(9/4+gamma), while ideal
    quotient-style H-pair routing still costs B^(9/4).
  - >-
    Routing through R=B^rho pairs has query exponent
    rho+9/4-gamma; polylogarithmic query under nonempty balanced buckets
    isolates gamma=9/4 and rho=0.
  - >-
    The isolated cap-compatible corner is a B^(9/4)-state C3
    singleton-bucket index with an implicit O(1)-pair target router; no such
    router is constructed.
  - >-
    Twenty-four coordinate-hash controls verify all-pair and target-bucket
    routed membership, empty rejection, and C2+C3 source replay.
