verified_statements:
  - >-
    The positive C6 source universe has M=binomial(d+5,6)=Theta(d^6)
    elements, and unique endpoint support is at least M/2 except with
    probability at most 2M/q.
  - >-
    Eight q log(d)/M independent known targets per factor-base column
    leave any column uncovered with probability at most d^(-3),
    conditional on half-unique endpoint support.
  - >-
    The all-column target count is B^(5/4+o(1)).
  - >-
    Conditional on coverage and selected sources, independent diagonal
    shifts give a nonzero determinant polynomial and full-rank failure at
    most d/q=B^(-17/4).
  - >-
    Conditioning iid labels to be nonzero and pairwise distinct up to sign
    transfers the theorem to the ideal rejection-sampled hash-to-curve law.
  - >-
    Identical positive-C6 lookup at Q+tG reduces target descent to the same
    missing source-locator mechanism.
  - >-
    All 12 public-curve controls cover every column, have full rank, verify
    every recovered factor log, and verify identical target descent.
  - >-
    Explicit finite endpoint enumeration costs B^(9/2), so the finite
    controls receive no attack credit.
