verified_statements:
  - >-
    A Mobius map not preserving the four Kummer branch points gives a
    connected biquadratic fiber product with independent sign involutions.
  - >-
    Equality of complete trace and norm on that fiber product makes one
    translated branch pair coincide identically.
  - >-
    The coincident pair forces f to be invariant under translation by 2A,
    which has order N for every nonzero endpoint A in the odd prime subgroup.
  - >-
    A separable degree-m map has at most m deck automorphisms, contradicting
    m<N.
  - >-
    Every Galois common-factor deck group embeds in the Kummer four-branch
    stabilizer, so its degree is at most 24.
