verified_statements:
  - >-
    Coupling the x and signed-y residuals with a per-target Fermat projector,
    multiplying over targets, and taking gcd with U returns exactly the union
    of participating left C3 endpoints.
  - >-
    Multiplying x residuals and y residuals separately is invalid because
    their zero factors may come from different targets.
  - >-
    For K unique positive-C6 targets, the union factor has degree at most 20K.
  - >-
    Given union roots, scanning N targets per root recovers target labels,
    both C3 backpointers, and positive-C6 sources in B^2 total work.
  - >-
    Six finite controls verify exact union factors, sources, labels, empty
    targets, and inherited exceptional semantics.
  - >-
    A synthetic Q=-2P, T=-P control verifies a genuine positive denominator-
    exceptional match with x(T)=x(P).
