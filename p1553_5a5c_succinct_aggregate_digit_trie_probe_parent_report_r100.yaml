verified_statements:
  - >-
    Universal exact D-subset membership requires at least binomial(p,D)
    distinguishable persistent states.
  - >-
    Under p=B^5 and D=B^12/5, the resulting field-word bound is at least
    13D/25 and retains exponent B^12/5.
  - >-
    Explicit and Patricia tries retain Theta(D) terminal or branch state,
    and complete duplicate occurrence return retains D payloads.
  - >-
    A structured interval family has an exact two-word membership and source
    summary, so the universal bound does not cover every structured family.
